                status: "pending"
              - title: "マツダ向け提案書作成（実績ベース）"
                status: "pending"
              - title: "初回面談獲得"
                status: "pending"

      - id: "3-B"
        title: "B. 提案・契約獲得"
        issues:
          - id: "3-B-01"
            title: "パイロット案件獲得"
            context: "小さく始めて信頼を築く"
            tasks:
              - title: "スモールスタート案件の提案"
                status: "pending"
              - title: "パイロット実施・成果創出"
                status: "pending"
              - title: "本格契約への拡大提案"
                status: "pending"
