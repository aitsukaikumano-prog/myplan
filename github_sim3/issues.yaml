# マツダ救済プロジェクト Issues
# 最終更新: 2026-01-13
# 目標: 6-10ヶ月以内にマツダからAIコンサル案件を獲得する

version: 1
project: mazda_rescue

strategies:
  - id: "1"
    title: "基盤構築（月1-2）"
    categories:
      - id: "1-A"
        title: "A. 自己ブランディング確立"
        issues:
          - id: "1-A-01"
            title: "提供価値の明確化"
            context: "何を売るのかの仮説を立てる（詳細は顧客接点後に検証）"
            tasks:
              - title: "自分のスキル棚卸し（Web/AI/業務改善）"
                status: "in_progress"
                subtasks:
                  - title: "Webアプリ開発経験の整理"
                    items:
                      - "ゴミ分別LINEbot（Dify）- 表記揺れ対応+RAGハイブリッド設計"
                      - "LINEブリッジ（n8n）- システム間連携"
                      - "髪型生成アプリ（Firebase+Stripe）- 課金システム込み公開中"
                      - "OCRアプリ（Dify）- 画像→テキスト変換"
                      - "業務ワークスペース（React+GitHub+Claude）- マツダ課題から着想"
                  - title: "AI関連スキルの洗い出し"
                    items:
                      - "Dify: 10本のフロー構築経験"
                      - "n8n: 3本のワークフロー構築"
                      - "RAG+コード照合のハイブリッド設計"
                      - "プロンプト設計・最適化"
                      - "API連携（LINE/Stripe/OpenAI）"
                  - title: "業務改善ツールの実績まとめ"
                    items:
                      - "マツダ経験: 2ヶ月→1日の無駄を発見"
                      - "課題: 目標曖昧、上司間不整合、承認後50%中止"
                      - "解決策: AI駆動業務環境の構築"
                      - "ビジョン: 業務のAIシフト革命"
              - title: "製造業の一般的な課題リサーチ"
                status: "pending"
                subtasks:
                  - "製造業DXの動向調査"
                  - "よくある課題パターンの整理"
              - title: "仮説としてのサービス案3つ作成"
                status: "pending"
          - id: "1-A-02"
            title: "営業ツール整備"
            context: "信頼を得るための最低限のツール"
            tasks:
              - title: "屋号決定・名刺デザイン・印刷"
                status: "pending"
              - title: "ポートフォリオWebサイト作成"
                status: "pending"
              - title: "1分エレベーターピッチ作成"
                status: "pending"

      - id: "1-B"
        title: "B. ターゲット企業リサーチ"
        issues:
          - id: "1-B-01"
            title: "マツダサプライヤー調査"
            context: "実績構築のためのターゲット企業を特定"
            tasks:
              - title: "マツダTier1サプライヤーリスト作成（上位20社）"
                status: "pending"
              - title: "各社のAI/DX取り組み状況調査"
                status: "pending"
              - title: "アプローチ優先順位付け（規模・課題・接点可能性）"
                status: "pending"
          - id: "1-B-02"
            title: "広島製造業コミュニティ調査"
            context: "接点を作るための情報収集"
            tasks:
              - title: "製造業向けセミナー・イベント一覧作成"
                status: "pending"
              - title: "商工会議所・産業支援機関のリストアップ"
                status: "pending"
              - title: "参加すべきイベント3つ決定"
                status: "pending"

  - id: "2"
    title: "実績構築（月2-6）"
    categories:
      - id: "2-A"
        title: "A. サプライヤーへのアプローチ"
        issues:
          - id: "2-A-01"
            title: "アプローチ活動"
            context: "とにかく接点を作る"
            tasks:
              - title: "イベント・セミナーへの参加（月2回以上）"
