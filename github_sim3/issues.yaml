              - title: "案件実行・成果創出"
                status: "pending"
              - title: "有償案件2社目獲得"
                status: "pending"
          - id: "2-B-02"
            title: "成果のドキュメント化"
            context: "マツダへの提案に使える実績資料"
            tasks:
              - title: "ケーススタディ作成（Before/After/数値成果）"
                status: "pending"
              - title: "顧客の声（推薦文）取得"
                status: "pending"
              - title: "ポートフォリオサイト更新"
                status: "pending"

      - id: "2-C"
        title: "C. マツダへの布石"
        issues:
          - id: "2-C-01"
            title: "サプライヤー経由のルート開拓"
            context: "サプライヤーからマツダへの紹介ルートを探る"
            tasks:
              - title: "サプライヤー担当者にマツダとの接点をヒアリング"
                status: "pending"
              - title: "紹介可能なキーパーソンの特定"
                status: "pending"
              - title: "マツダ関係者との接点イベント調査"
                status: "pending"

  - id: "3"
