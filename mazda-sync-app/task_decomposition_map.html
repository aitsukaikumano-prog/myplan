<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MAZDA Sync | Dynamic Task Decomposition</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .node-line { position: absolute; left: 50%; width: 2px; background: #e2e8f0; z-index: -1; }
        .node-card { transition: all 0.3s ease; border: 2px solid transparent; }
        .node-card:hover { transform: scale(1.02); border-color: #3b82f6; }
        .progress-bar { height: 4px; border-radius: 2px; background: #e2e8f0; overflow: hidden; }
        .progress-fill { height: 100%; background: #3b82f6; transition: width 0.5s ease; }
    </style>
</head>
<body class="bg-slate-50 p-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const DECOMPOSITION_DATA = {
            id: "G1", title: "営業利益のV字回復", level: "Goal", progress: 35,
            children: [
                {
                    id: "S1", title: "固定費の構造的削減 (-1,000億円)", level: "Strategy", progress: 40,
                    children: [
                        {
                            id: "P1", title: "手戻り・重複作業の撲滅", level: "Project", progress: 25,
                            children: [
                                { id: "A1", title: "佐藤工場長への知見ヒアリング", level: "Action", owner: "daiki", status: "In Progress" },
                                { id: "A2", title: "過去3年分の不具合DB解析", level: "Action", owner: "ケンジ", status: "Pending" }
                            ]
                        }
                    ]
                },
                {
                    id: "S2", title: "限界利益の最大化 (+500億円)", level: "Strategy", progress: 20,
                    children: [
                        {
                            id: "P2", title: "市場価値見極めAI導入", level: "Project", progress: 50,
                            children: [
                                { id: "A3", title: "FVP算出アルゴリズムの策定", level: "Action", owner: "daiki", status: "Done" }
                            ]
                        }
                    ]
                }
            ]
        };

        function Node({ data }) {
            return (
                <div class="flex flex-col items-center w-full min-w-[250px]">
                    <div class={`node-card bg-white p-5 rounded-2xl shadow-sm w-full relative ${data.level === 'Action' ? 'bg-blue-50' : ''}`}>
                        <div class="flex justify-between items-start mb-2">
                            <span class={`text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded ${
                                data.level === 'Goal' ? 'bg-slate-900 text-white' :
                                data.level === 'Strategy' ? 'bg-blue-600 text-white' :
                                data.level === 'Project' ? 'bg-blue-100 text-blue-600' : 'bg-white text-slate-400'
                            }`}>{data.level}</span>
                            {data.owner && <span class="text-[8px] font-bold text-slate-400">Owner: {data.owner}</span>}
                        </div>
                        <h4 class={`text-sm font-black mb-3 ${data.level === 'Goal' ? 'text-lg' : ''}`}>{data.title}</h4>
                        
                        {data.progress !== undefined && (
                            <div class="mt-2">
                                <div class="flex justify-between text-[8px] font-bold mb-1">
                                    <span>Progress</span>
                                    <span>{data.progress}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style={{width: `${data.progress}%`}}></div>
                                </div>
                            </div>
                        )}
                        
                        {data.status && (
                            <span class={`text-[8px] font-bold px-2 py-1 rounded-full ${
                                data.status === 'Done' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'
                            }`}>{data.status}</span>
                        )}
                    </div>

                    {data.children && (
                        <div class="w-full">
                            <div class="node-line h-8"></div>
                            <div class="flex justify-center space-x-8 mt-8">
                                {data.children.map(child => (
                                    <Node key={child.id} data={child} />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            return (
                <div class="w-full overflow-x-auto pb-20">
                    <header class="mb-16 text-center">
                        <h1 class="text-4xl font-black italic tracking-tighter text-slate-900">TASK <span class="text-blue-600">DECOMPOSITION</span></h1>
                        <p class="text-slate-500 text-sm mt-2 font-bold uppercase tracking-[0.3em]">マツダ再興：目標の論理分解図</p>
                    </header>
                    
                    <div class="flex justify-center">
                        <Node data={DECOMPOSITION_DATA} />
                    </div>

                    <div class="fixed bottom-10 right-10 bg-white p-6 rounded-2xl shadow-2xl border border-slate-100 max-w-xs animate-in slide-in-from-bottom-4">
                        <p class="text-[10px] font-black text-blue-600 uppercase mb-2 italic">How to read this map</p>
                        <p class="text-xs text-slate-600 leading-relaxed font-medium">
                            上位目標をクリックすると詳細が表示されます。下のActionが完了すると、自動的に上位のStrategyのProgressが押し上げられます。
                        </p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
