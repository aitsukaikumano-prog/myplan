<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MAZDA Sync | Philosophy & Profit Alignment</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 p-8">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div class="max-w-5xl mx-auto space-y-10">
                    <header class="text-center">
                        <h1 class="text-4xl font-black italic tracking-tighter text-gray-900">MAZDA SYNC <span class="text-blue-600">DEFINITION</span></h1>
                        <p class="text-gray-500 text-sm mt-2 font-bold uppercase tracking-widest">「魂」と「数字」を同期させる設計</p>
                    </header>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        {/* 左：精神レイヤー (Brand Philosophy) */}
                        <div class="bg-white p-10 rounded-3xl shadow-xl border-t-8 border-gray-900">
                            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center">
                                <i class="fas fa-heart mr-2 text-red-500"></i> レイヤー1：マツダの魂 (Brand/Value)
                            </h2>
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-black mb-2 italic">ブランドビジョン</label>
                                    <div class="p-4 bg-gray-900 text-white rounded-xl text-sm italic leading-relaxed">
                                        「前向きに今日を生きる人の輪を広げる」
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-black mb-2 italic">マツダWay (Mazda 7)</label>
                                    <div class="grid grid-cols-2 gap-2 text-[10px] font-bold">
                                        {['飽くなき挑戦', '共創', '誠実', '自己研鑽', '現場主義', 'お客様第一', '効率性'].map(v => (
                                            <div key={v} class="flex items-center p-2 border rounded-lg hover:bg-red-50 hover:border-red-200 cursor-pointer transition-all">
                                                <input type="checkbox" class="mr-2" /> {v}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 右：戦略レイヤー (Business Logic) */}
                        <div class="bg-white p-10 rounded-3xl shadow-xl border-t-8 border-blue-600">
                            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center">
                                <i class="fas fa-calculator mr-2 text-blue-500"></i> レイヤー2：経営の算盤 (Profit/Survival)
                            </h2>
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-black mb-2 italic">このアクションで動かす「財務レバー」</label>
                                    <select class="w-full p-4 bg-blue-50 border-0 rounded-xl text-sm font-bold text-blue-900 outline-none">
                                        <option>固定費 (R&D/販管費) の削減</option>
                                        <option>正味単価 (Net Pricing) の防衛</option>
                                        <option>リセールバリューの向上</option>
                                        <option>変動費 (製造コスト) の低減</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-black mb-2 italic">具体的・定量的ターゲット</label>
                                    <input type="text" class="w-full p-4 bg-gray-50 border-0 rounded-xl text-sm font-bold outline-none" placeholder="例：工数削減 180億円分" />
                                </div>
                                <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                                    <p class="text-[10px] font-bold text-blue-600 italic">
                                        <i class="fas fa-robot mr-1"></i> AI Strategic Insight:
                                    </p>
                                    <p class="text-[11px] text-blue-800 leading-relaxed font-medium mt-1">
                                        「飽くなき挑戦」という魂を、「固定費削減」という現実的な生存戦略に結びつけます。これにより、現場の熱量を削ぐことなく、経営課題を解決します。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col items-center space-y-4">
                        <div class="h-10 w-0.5 bg-gray-200"></div>
                        <button class="px-20 py-5 bg-gray-900 text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-2xl hover:bg-black transition-all transform hover:-translate-y-1">
                            魂と数字を同期（Sync）してタスクを作成
                        </button>
                        <p class="text-[10px] text-gray-400 font-bold uppercase">※この論理の紐付けが、全社員の共有資産（GitHub）となります。</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
