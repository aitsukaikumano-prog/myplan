<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MAZDA Sync | Technical Deep Dive Tree</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .node-line-v { width: 2px; height: 30px; background: #cbd5e1; margin: 0 auto; }
        .node-line-h { height: 2px; background: #cbd5e1; margin: 0 auto; flex: 1; }
        .node-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .node-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border-color: #3b82f6; }
        .issue-box { background: #3b82f6; color: white; padding: 10px 15px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; margin-top: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="p-10">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Node = ({ title, level, type, children, issues }) => (
            <div class="flex flex-col items-center flex-1 min-w-[200px]">
                <div class={`node-card bg-white p-5 rounded-2xl border-2 shadow-sm w-full text-center ${
                    type === 'purpose' ? 'border-gray-900 bg-gray-900 text-white' : 
                    type === 'strategy' ? 'border-blue-600' : 'border-gray-200'
                }`}>
                    <p class={`text-[8px] font-black uppercase tracking-[0.2em] mb-1 ${
                        type === 'purpose' ? 'text-blue-400' : 'text-gray-400'
                    }`}>{level}</p>
                    <h4 class="text-xs font-black leading-tight italic">{title}</h4>
                </div>

                {issues && issues.map((issue, idx) => (
                    <div key={idx} class="issue-box w-[90%] flex items-center">
                        <i class="fab fa-github mr-2"></i>
                        <span class="truncate">Issue: {issue}</span>
                    </div>
                ))}

                {children && (
                    <React.Fragment>
                        <div class="node-line-v"></div>
                        <div class="w-full flex">
                            <div class="node-line-h"></div>
                            <div class="node-line-h"></div>
                        </div>
                        <div class="flex items-start w-full pt-6 space-x-6">
                            {children}
                        </div>
                    </React.Fragment>
                )}
            </div>
        );

        function App() {
            return (
                <div class="max-w-[1400px] mx-auto overflow-x-auto pb-32">
                    <header class="mb-20 text-center">
                        <h1 class="text-4xl font-black italic tracking-tighter text-gray-900">TECHNICAL <span class="text-blue-600">DEEP DIVE</span></h1>
                        <p class="text-gray-500 text-sm mt-2 font-bold uppercase tracking-[0.3em]">「魂のビジョン」から「ハンダ付けのタスク」までを繋ぐ</p>
                    </header>

                    <div class="flex justify-center">
                        <Node level="L1: Purpose" title="前向きに今日を生きる人の輪を広げる" type="purpose">
                            {/* L2: 良いものを作る */}
                            <Node level="L2: Value" title="感性価値の最大化（＝良いものを作る）" type="strategy">
                                {/* L3: 各技術領域 */}
                                <Node level="L3: System" title="エンジン・駆動系" />
                                <Node level="L3: System" title="電気・電子・ADAS系">
                                    <Node level="L4: Component" title="ADAS制御系" />
                                    <Node level="L4: Component" title="音響・インフォテインメント">
                                        <Node level="L5: Tech Goal" title="原音再生の追求（音の純度）" issues={["スピーカー配置の最適化", "定在波除去アルゴリズム実装"]} />
                                        <Node level="L5: Tech Goal" title="空間オーディオ体験" issues={["立体音響シミュレーション"]} />
                                    </Node>
                                    <Node level="L4: Component" title="信頼性・電子基盤" />
                                </Node>
                                <Node level="L3: System" title="シャシー・サスペンション系" />
                            </Node>
                        </Node>
                    </div>

                    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-gray-100 flex items-center space-x-8 max-w-2xl">
                        <div class="flex-1">
                            <h3 class="text-sm font-black italic mb-1">エンジニアの誇りを同期する。</h3>
                            <p class="text-[10px] text-gray-500 leading-relaxed font-medium">
                                音響系エンジニアの「タスク」は、単なる作業ではありません。それはLevel 1の「人の輪を広げる」ための不可欠なピースです。このマップは、全ての専門領域が経営ビジョンの一部であることを証明します。
                            </p>
                        </div>
                        <div class="flex space-x-4">
                            <div class="text-center">
                                <p class="text-[8px] font-black text-gray-400 uppercase mb-1">Linked Issues</p>
                                <p class="text-xl font-black text-blue-600 leading-none">1,240</p>
                            </div>
                            <div class="text-center border-l pl-4">
                                <p class="text-[8px] font-black text-gray-400 uppercase mb-1">Logic Alignment</p>
                                <p class="text-xl font-black text-green-500 leading-none">100%</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
