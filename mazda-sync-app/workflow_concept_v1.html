<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MAZDA Sync UI Concept v1.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .step-active { border-left: 4px solid #3b82f6; background: #eff6ff; }
        .step-pending { border-left: 4px solid #e5e7eb; }
    </style>
</head>
<body class="bg-gray-100 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <h1 class="text-3xl font-black text-gray-900 text-center">MAZDA Sync：作業・承認ワークフロー</h1>

        <!-- Step 1: Input Assist -->
        <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 text-[10px] font-bold text-blue-500 uppercase">Step 1: Input Assist</div>
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <i class="fas fa-pen-nib mr-3 text-blue-500"></i> 作業の開始・ログ入力
            </h2>
            <div class="mb-4">
                <button class="bg-blue-600 text-white text-[10px] px-3 py-1 rounded-full font-bold hover:bg-blue-700 transition-all">
                    <i class="fas fa-bullseye mr-1"></i> 今の方針を確認する
                </button>
            </div>
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-4 text-xs text-blue-800 italic">
                AI Assistant: 「本件は『R&D効率化』に直結します。特に佐藤工場長が懸念していた『過去データの検索性』に焦点を当てて入力してください。」
            </div>
            <textarea class="w-full h-32 p-4 bg-gray-50 border rounded-xl text-sm" placeholder="本日の作業内容を入力..."></textarea>
        </div>

        <!-- Step 2: Output Check -->
        <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 relative">
            <div class="absolute top-0 right-0 p-4 text-[10px] font-bold text-green-500 uppercase">Step 2: Sync Check</div>
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <i class="fas fa-sync mr-3 text-green-500"></i> 戦略整合性チェック
            </h2>
            <div class="flex items-center space-x-4 mb-4">
                <div class="text-3xl font-black text-green-600">92%</div>
                <p class="text-xs text-gray-500">上位方針との一致度が高いです。このまま報告書を作成しますか？</p>
            </div>
            <button class="w-full py-2 bg-gray-900 text-white rounded-lg text-sm font-bold shadow-md">リーダーへ承認申請を送る</button>
        </div>

        <!-- Step 3: Leader Approval (Different User View) -->
        <div class="bg-gray-900 p-8 rounded-2xl shadow-2xl relative text-white">
            <div class="absolute top-0 right-0 p-4 text-[10px] font-bold text-gray-400 uppercase">Leader View (佐藤工場長/上司)</div>
            <h2 class="text-xl font-bold mb-6 flex items-center">
                <i class="fas fa-user-check mr-3 text-blue-400"></i> 承認待ちタスク
            </h2>
            <div class="space-y-4">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-gray-400">ケンジ (R&D部)</p>
                        <p class="text-sm font-bold">図面検索AI・プロトタイプ検証報告</p>
                    </div>
                    <div class="flex space-x-2">
                        <button class="px-3 py-1 bg-green-600 text-[10px] font-bold rounded">承認してGitHubへ反映</button>
                        <button class="px-3 py-1 bg-red-600 text-[10px] font-bold rounded">差し戻し</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
