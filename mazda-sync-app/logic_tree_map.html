<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MAZDA Sync | Logic Tree Decomposition</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tree-line-v { width: 2px; height: 30px; background: #94a3b8; margin: 0 auto; }
        .tree-line-h { height: 2px; background: #94a3b8; margin: 0 auto; }
        .logic-card { border: 1px solid #e2e8f0; transition: all 0.3s; }
        .logic-card:hover { border-color: #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .root-node { background: #f1f5f9; border-radius: 9999px; border: 2px solid #64748b; }
    </style>
</head>
<body class="bg-white p-12 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const LogicNode = ({ title, subTitle, isRoot, children, issues }) => (
            <div class="flex flex-col items-center flex-1">
                <div class={`logic-card p-4 min-w-[180px] text-center shadow-sm ${isRoot ? 'root-node' : 'bg-gray-50 rounded-lg'}`}>
                    <p class="text-xs font-black text-gray-800 tracking-tight">{title}</p>
                    {subTitle && <p class="text-[10px] text-gray-500 mt-1">{subTitle}</p>}
                </div>
                
                {issues && issues.length > 0 && (
                    <div class="mt-4 space-y-2 w-full px-2">
                        {issues.map(issue => (
                            <div key={issue} class="bg-blue-600 text-white text-[10px] p-2 rounded shadow-lg animate-pulse flex items-center">
                                <i class="fas fa-exclamation-circle mr-1 text-[8px]"></i>
                                <span class="truncate">Issue: {issue}</span>
                            </div>
                        ))}
                    </div>
                )}

                {children && (
                    <React.Fragment>
                        <div class="tree-line-v"></div>
                        <div class="w-full flex">
                            <div class="flex-1 border-t-2 border-slate-400"></div>
                            <div class="flex-1 border-t-2 border-slate-400"></div>
                        </div>
                        <div class="flex items-start w-full pt-4 space-x-4">
                            {children}
                        </div>
                    </React.Fragment>
                )}
            </div>
        );

        function App() {
            return (
                <div class="max-w-6xl mx-auto overflow-x-auto pb-20">
                    <header class="mb-16 text-center">
                        <h1 class="text-2xl font-black text-slate-900 mb-2 tracking-tighter italic uppercase">Goal Decomposition Map</h1>
                        <p class="text-slate-400 text-[10px] font-bold tracking-[0.5em]">経営目標から現場タスクへの「論理の継承」</p>
                    </header>

                    <div class="flex justify-center">
                        <LogicNode title="営業利益のV字回復" isRoot={true}>
                            {/* Level 1: 限界利益 と 固定費 */}
                            <LogicNode title="1. 限界利益の拡大">
                                <LogicNode title="単価 (P) 向上" subTitle="WTP最大化" />
                                <LogicNode title="数量 (Q) 確保" subTitle="市場適合性" />
                                <LogicNode title="変動費 (V) 削減" subTitle="コスト最適化" />
                            </LogicNode>

                            <LogicNode title="2. 固定費の構造改革">
                                <LogicNode title="R&D費の効率化" subTitle="手戻り・検索の撲滅" issues={["図面検索AIの開発", "不具合知見の資産化"]} />
                                <LogicNode title="販管費の最適化" subTitle="間接工数の削減" />
                            </LogicNode>
                        </LogicNode>
                    </div>

                    <div class="mt-20 p-8 bg-slate-900 text-white rounded-3xl shadow-2xl flex items-center justify-between">
                        <div class="max-w-md">
                            <h3 class="text-lg font-black italic mb-2 tracking-tight">「なぜこの仕事をしているのか」の可視化</h3>
                            <p class="text-xs text-gray-400 leading-relaxed">
                                青いボックスが、あなたやチームが今日取り組んでいる「Issue（GitHub）」です。<br/>
                                上にある全てのロジックを支えていることが一目で分かります。
                            </p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest block mb-2">System Status</span>
                            <div class="flex items-center text-green-400 font-black text-xl italic">
                                <i class="fas fa-check-circle mr-2"></i> LOGIC SYNCED
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
