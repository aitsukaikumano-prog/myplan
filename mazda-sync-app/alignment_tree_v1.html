<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MAZDA Sync | Strategic Alignment Tree</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tree-line { width: 2px; height: 30px; background: #cbd5e1; margin: 0 auto; }
        .node-active { border: 2px solid #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 p-10">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div class="max-w-4xl mx-auto space-y-2">
                    <h1 class="text-3xl font-black text-center mb-12 italic tracking-tighter">STRATEGIC <span class="text-blue-600">ALIGNMENT</span></h1>

                    {/* Level 1: 全社目標 */}
                    <div class="bg-slate-900 text-white p-6 rounded-2xl text-center shadow-xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10 text-4xl"><i class="fas fa-crown"></i></div>
                        <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1">Level 1: 全社最上位目標</p>
                        <h2 class="text-xl font-black">営業利益のV字回復 (Δ+1,500億円)</h2>
                        <p class="text-[10px] text-slate-400 mt-2 italic">※ここが「綺麗事」で終わらないための、全方位の出発点</p>
                    </div>

                    <div class="tree-line"></div>

                    {/* Level 2: 経営レバー */}
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm text-center node-active">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Level 2: 経営レバー</p>
                            <h3 class="font-black text-slate-800 italic">固定費の構造的削減</h3>
                            <div class="mt-2 text-[10px] font-bold text-blue-600">目標: -1,000億円</div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm text-center opacity-50">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Level 2: 経営レバー</p>
                            <h3 class="font-black text-slate-800">限界利益の拡大</h3>
                            <div class="mt-2 text-[10px] font-bold text-gray-400">目標: +500億円</div>
                        </div>
                    </div>

                    <div class="tree-line"></div>

                    {/* Level 3: 部門戦略 */}
                    <div class="bg-blue-600 text-white p-5 rounded-xl text-center shadow-lg max-w-sm mx-auto">
                        <p class="text-[10px] font-black text-blue-200 uppercase tracking-widest mb-1">Level 3: 部門戦略 (R&D)</p>
                        <h3 class="font-black italic">「手戻り・検索」による死に金の消滅</h3>
                        <div class="mt-1 text-[10px] font-bold">寄与度: 固定費削減の 18%</div>
                    </div>

                    <div class="tree-line"></div>

                    {/* Level 4: 個人タスク */}
                    <div class="bg-white p-6 rounded-2xl border-2 border-dashed border-blue-400 text-center shadow-inner max-w-md mx-auto relative">
                        <div class="absolute -top-3 -right-3 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center text-[10px] font-bold shadow-lg">YOU</div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Level 4: 個人タスク (daiki)</p>
                        <h4 class="font-black text-blue-600 text-lg">佐藤工場長への知見ヒアリング</h4>
                        <div class="mt-4 p-3 bg-slate-50 rounded-lg text-left">
                            <p class="text-[10px] font-bold text-slate-500 italic mb-1">AI Linker Logic:</p>
                            <p class="text-[11px] leading-relaxed text-slate-600 font-medium">
                                あなたのこの一歩が、Level 3の「検索コスト削減」を動かし、Level 1の「V字回復」に直結しています。
                            </p>
                        </div>
                    </div>

                    <div class="mt-12 text-center">
                        <button class="px-8 py-3 bg-slate-900 text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-xl hover:bg-black transition-all">
                            論理の繋がりを確認・コメントする
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
