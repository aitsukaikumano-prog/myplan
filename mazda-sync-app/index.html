<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZDA Sync | Real-time Organizational Alignment System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .sidebar-item:hover { background: rgba(37, 99, 235, 0.1); color: #2563eb; }
        .active-sidebar { background: rgba(37, 99, 235, 0.1); color: #2563eb; border-right: 4px solid #2563eb; }
        .markdown-content h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 1rem; border-bottom: 2px solid #eee; padding-bottom: 0.5rem; }
        .markdown-content h2 { font-size: 1.2rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #1f2937; }
        .markdown-content p { margin-bottom: 1rem; font-size: 0.875rem; color: #4b5563; line-height: 1.6; }
        .markdown-content ul { list-style: disc; margin-left: 1.5rem; margin-bottom: 1rem; font-size: 0.875rem; color: #4b5563; }
        .markdown-content li { margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const REPO_FILES = {
            "STRATEGY.md": `# マツダ再興：全社上位方針 (Main Strategy)\n\n## 1. 最終目標 (Goal)\n- **2025年 H2 営業利益の黒字化**\n- **固定費（R&D/販管費）の構造적削減（1,000億円規模）**\n\n## 2. 戦略の柱 (Pillars)\n1. **R&D効率化 (Speed & Lean)**: 開発現場の「死に時間」を排除し、価値創造に集中する。\n2. **価値見極め (WTP Focus)**: 顧客が対価を払う機能を見極め、値引き（インセンティブ）を最小化する。\n\n## 3. 本期の最重点領域\n- **図面検索・管理プロセスのDX**: R&D固定費削減のクイックウィン（即効性のある成果）として位置づける。`,
            "VISION_STORY.md": `# 変革ドキュメンタリー：意志が繋がった日\n**〜GitHub型同期システムが変えた、ある若手エンジニアの24時間〜**\n\n### 登場人物\n* **ケンジ（26歳）**: R&D本部・入社3年目。\n* **佐藤工場長（58歳）**: 現場の生き字引。\n\n---\n\n## 10:00 | 現在のケンジ： 「知見の共鳴」\nPCを開き、**MAZDA SYNC**のダッシュボードに「ボルト 締結不良 対策」と打ち込む。瞬時にAIが関連情報を提示。探し物の時間は、過去の先鋭たちとの対話へと変わった。`,
            "DEPT_STRATEGY.md": `# 商品戦略部：2026年度 モデル価値向上プロジェクト\n\n## 1. 上位組織（経営）からのミッション\n- **リセールバリュー（3年残価率）の 5% 向上**\n- **値引き（販売インセンティブ）の 30% 削減**\n\n## 2. 部の方針：WTP（支払い意欲）重視型・商品改良\n「エンジニアのこだわりを、顧客の『財布が開く価値』へと変換し、一台あたりの限界利益を最大化する」\n\n## 3. 重点プロジェクト：価値実証 5大プロトタイプ\n1. 感性価値の定量化（デザイン）\n2. デジタル体験の統合（コネクティッド）\n3. 走りの質感の再定義（ダイナミクス）\n4. 持続可能なラグジュアリー（マテリアル）\n5. 所有体験のDX（サービス・アプリ）`,
            "KANBAN.md": `# マツダ再興プロジェクト：進捗ボード (Kanban)\n\n## 🎯 Backlog (未着手)\n- [ ] Issue #002: 市場価値見極めAIのアルゴリズム策定\n- [ ] Issue #003: トヨタ共通部品採用による原価低減シミュレーション\n\n## 🏗️ In Progress (進行中)\n- [x] **Issue #001: 図面検索工数の削減によるR&D固定費の圧縮**\n- [ ] **Mazda Sync プロトタイプ実証 (mazda-sync-app)**\n\n## ✅ Done (完了)\n- [x] 全社財務分析（Version 8.0）\n- [x] 組織変革プロポーザル（GitHub型業務管理）\n- [x] フロントエンド・システム基盤構築 (React/Tailwind)\n- [x] **Issue #002: 市場価値見極めAIのアルゴリズム策定**`,
            "issues/001_drawing_search.md": `# Issue #001: 図面検索工数の削減によるR&D固定費の圧縮\n\n## 1. 解決すべき課題 (Problem)\nマツダの開発現場において、過去の設計図面や知見の検索に、エンジニア一人あたり週平均5時間が費やされている。\n\n## 2. 成功の定義 (Definition of Done)\n- [ ] 現場エンジニア（佐藤工場長等）へのヒアリング\n- [ ] AIプロトタイプによる検索時間の50%削減の証明`,
            "issues/002_value_quantization.md": `# Issue #002: 市場価値見極めAIのアルゴリズム策定\n\n## 1. 解決すべき課題 (Problem)\n「いいものを作れば売れる」という主観的な開発を脱却するため、顧客の支払い意欲（WTP）を定量化するロジックが必要。\n\n## 2. 成果物 (Deliverables)\n- [x] カノ・モデルによる機能分類ロジックの定義\n- [x] ヘドニック価格理論とコンジョイント分析のハイブリッドロジック`
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedFile, setSelectedFile] = useState('STRATEGY.md');
            const [workLog, setWorkLog] = useState('');
            const [syncResult, setSyncResult] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);

            const handleSync = () => {
                if (!workLog) return;
                setIsSyncing(true);
                setTimeout(() => {
                    setSyncResult({
                        score: 85,
                        summary: "上位方針「R&D効率化」との高い親和性を確認。現場の心を開くアプローチが評価されました。",
                        recommendations: ["STRATEGY.md", "issues/001_drawing_search.md"]
                    });
                    setIsSyncing(false);
                }, 1000);
            };

            const renderMarkdown = (text) => {
                const lines = text.split('\n');
                return lines.map((line, i) => {
                    if (line.startsWith('# ')) return <h1 key={i}>{line.substring(2)}</h1>;
                    if (line.startsWith('## ')) return <h2 key={i}>{line.substring(3)}</h2>;
                    if (line.startsWith('- ')) return <li key={i}>{line.substring(2)}</li>;
                    return <p key={i}>{line}</p>;
                });
            };

            return (
                <div class="flex h-screen overflow-hidden text-gray-800">
                    {/* Sidebar */}
                    <div class="w-64 glass border-r flex flex-col z-20">
                        <div class="p-6">
                            <h1 class="text-2xl font-black tracking-tighter text-gray-900 italic">MAZDA <span class="text-blue-600">SYNC</span></h1>
                            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1 text-center">Organizational OS</p>
                        </div>
                        <nav class="flex-1 mt-4">
                            {[
                                { id: 'dashboard', icon: 'fa-chart-line', label: 'Dashboard' },
                                { id: 'repository', icon: 'fa-folder-open', label: 'Repository' },
                                { id: 'tasks', icon: 'fa-tasks', label: 'Tasks' },
                                { id: 'strategy', icon: 'fa-bullseye', label: 'Strategy' },
                            ].map(tab => (
                                <div key={tab.id} onClick={() => setActiveTab(tab.id)} 
                                     class={`sidebar-item px-6 py-4 cursor-pointer flex items-center space-x-3 transition-all ${activeTab === tab.id ? 'active-sidebar' : 'text-gray-500'}`}>
                                    <i class={`fas ${tab.icon} w-5`}></i>
                                    <span class="text-sm font-semibold">{tab.label}</span>
                                </div>
                            ))}
                        </nav>
                        <div class="p-4 border-t text-[10px] text-gray-400 text-center">
                            Logged in as: <b>daiki</b>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div class="flex-1 overflow-y-auto bg-gray-50 relative">
                        {/* Header Decoration */}
                        <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-blue-50 to-transparent -z-10"></div>

                        <div class="p-8 max-w-6xl mx-auto">
                            {activeTab === 'dashboard' && (
                                <div class="animate-in fade-in slide-in-from-top-4 duration-500">
                                    <header class="mb-8">
                                        <h2 class="text-4xl font-black text-gray-900 tracking-tight">Sync Your Work</h2>
                                        <p class="text-gray-500 mt-2">今日の足跡を、組織の資産へ。</p>
                                    </header>

                                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div class="lg:col-span-2 space-y-6">
                                            <div class="card p-8 bg-white shadow-xl shadow-blue-100/50 border border-blue-50 rounded-2xl">
                                                <h3 class="text-xs font-black text-blue-500 uppercase tracking-widest mb-6 flex items-center">
                                                    <span class="w-2 h-2 bg-blue-500 rounded-full mr-2 animate-pulse"></span>
                                                    Work Logger
                                                </h3>
                                                <textarea 
                                                    value={workLog}
                                                    onChange={(e) => setWorkLog(e.target.value)}
                                                    class="w-full p-6 bg-gray-50 border-0 rounded-xl text-sm focus:ring-4 focus:ring-blue-100 outline-none transition-all min-h-[200px] leading-relaxed"
                                                    placeholder="今日取り組んだこと、気づいたこと、直面した課題を入力..."
                                                ></textarea>
                                                <div class="flex justify-between items-center mt-6">
                                                    <p class="text-[10px] text-gray-400 font-medium">※AIが自動的に戦略との整合性をスコアリングし、日報を作成します。</p>
                                                    <button 
                                                        onClick={handleSync}
                                                        disabled={isSyncing || !workLog}
                                                        class={`px-8 py-3 bg-gray-900 text-white rounded-xl font-bold text-sm shadow-xl hover:bg-black transition-all transform hover:-translate-y-1 ${isSyncing ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                    >
                                                        {isSyncing ? <i class="fas fa-sync fa-spin mr-2"></i> : <i class="fas fa-bolt mr-2 text-yellow-400"></i>}
                                                        同期を開始
                                                    </button>
                                                </div>
                                            </div>

                                            {syncResult && (
                                                <div class="card p-8 bg-blue-600 text-white shadow-2xl shadow-blue-400/30 rounded-2xl animate-in slide-in-from-bottom-8 duration-500">
                                                    <div class="flex justify-between items-center mb-6">
                                                        <h3 class="font-black text-xl tracking-tight">AI Analysis Results</h3>
                                                        <div class="flex items-center space-x-2">
                                                            <div class="text-4xl font-black">{syncResult.score}</div>
                                                            <div class="text-xs font-bold uppercase tracking-widest leading-none">Align<br/>Score</div>
                                                        </div>
                                                    </div>
                                                    <p class="text-sm mb-8 leading-relaxed font-medium bg-blue-500/30 p-4 rounded-xl border border-blue-400/50">{syncResult.summary}</p>
                                                    <button class="w-full py-4 bg-white text-blue-600 rounded-xl text-sm font-black shadow-lg hover:bg-blue-50 transition-all uppercase tracking-widest">
                                                        日報を生成・送信
                                                    </button>
                                                </div>
                                            )}
                                        </div>

                                        <div class="space-y-6">
                                            <div class="card p-6 bg-white shadow-lg border border-gray-100 rounded-2xl">
                                                <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Target KPI</h3>
                                                <p class="text-xl font-black text-gray-900 leading-none mb-2">R&D固定費 180億円削減</p>
                                                <div class="w-full bg-gray-100 h-3 rounded-full mt-4 overflow-hidden shadow-inner">
                                                    <div class="bg-gradient-to-r from-blue-500 to-green-400 h-full" style={{width: '35%'}}></div>
                                                </div>
                                                <div class="flex justify-between mt-2 font-bold text-[10px]">
                                                    <span class="text-blue-500 tracking-tighter uppercase">Current: 35%</span>
                                                    <span class="text-gray-400 tracking-tighter uppercase">Goal: 100%</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'repository' && (
                                <div class="animate-in fade-in duration-500 h-full">
                                    <header class="mb-8">
                                        <h2 class="text-4xl font-black text-gray-900 tracking-tight tracking-tight">Repository</h2>
                                        <p class="text-gray-500 mt-2">組織の全知見がここに。(`github_sim/`)</p>
                                    </header>
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-4 gap-8 h-[600px]">
                                        {/* File Tree */}
                                        <div class="bg-white border rounded-2xl p-6 overflow-y-auto shadow-sm">
                                            <h3 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-6">Files</h3>
                                            <div class="space-y-2">
                                                {Object.keys(REPO_FILES).map(path => (
                                                    <div 
                                                        key={path} 
                                                        onClick={() => setSelectedFile(path)}
                                                        class={`px-3 py-2 rounded-lg text-xs font-bold cursor-pointer transition-all flex items-center space-x-2 ${selectedFile === path ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-600 hover:bg-gray-100'}`}
                                                    >
                                                        <i class={`fas ${path.includes('/') ? 'fa-file-code' : 'fa-file-alt'} opacity-70`}></i>
                                                        <span class="truncate">{path}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* File Content */}
                                        <div class="md:col-span-3 bg-white border rounded-2xl shadow-sm flex flex-col overflow-hidden">
                                            <div class="px-6 py-3 border-b bg-gray-50 flex items-center justify-between">
                                                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">{selectedFile}</span>
                                                <div class="flex space-x-1">
                                                    <div class="w-2 h-2 rounded-full bg-gray-200"></div>
                                                    <div class="w-2 h-2 rounded-full bg-gray-200"></div>
                                                    <div class="w-2 h-2 rounded-full bg-gray-200"></div>
                                                </div>
                                            </div>
                                            <div class="p-10 overflow-y-auto markdown-content">
                                                {renderMarkdown(REPO_FILES[selectedFile])}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'tasks' && (
                                <div class="animate-in fade-in duration-500">
                                    <h2 class="text-4xl font-black text-gray-900 tracking-tight mb-8">Tasks</h2>
                                    <p class="text-gray-500 mb-8">あなたの担当案件です。</p>
                                    <div class="space-y-4">
                                        {[
                                            { id: "010", title: "現場ヒアリング（佐藤工場長）", dept: "ワークスタイル改革", status: "In Progress", align: 92 },
                                            { id: "006", title: "意思決定同期AI開発", dept: "ディシジョン・シンクロ", status: "In Progress", align: 88 }
                                        ].map(task => (
                                            <div key={task.id} class="p-8 bg-white border-l-8 border-l-blue-600 rounded-2xl flex items-center justify-between shadow-lg hover:shadow-xl transition-all group">
                                                <div>
                                                    <div class="flex items-center space-x-3 mb-2">
                                                        <span class="px-2 py-1 bg-gray-100 text-[10px] font-black text-gray-500 rounded uppercase">#{task.id}</span>
                                                        <h4 class="font-black text-xl text-gray-800 group-hover:text-blue-600 transition-colors">{task.title}</h4>
                                                    </div>
                                                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">{task.dept}</p>
                                                </div>
                                                <div class="text-right">
                                                    <div class="text-3xl font-black text-blue-600 mb-1">{task.align}%</div>
                                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Alignment Score</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'strategy' && (
                                <div class="animate-in fade-in duration-500">
                                    <h2 class="text-4xl font-black text-gray-900 tracking-tight mb-12">Strategy Root</h2>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <div class="relative">
                                            <div class="absolute -top-6 -left-6 w-24 h-24 bg-blue-600/10 rounded-full -z-10 animate-pulse"></div>
                                            <h3 class="text-2xl font-black mb-6 border-b-4 border-gray-900 inline-block">全社最上位方針</h3>
                                            <div class="space-y-6 mt-8">
                                                <div class="p-6 bg-white shadow-xl rounded-2xl border border-gray-100">
                                                    <p class="text-sm font-black text-blue-600 mb-2 uppercase tracking-widest">Target 01</p>
                                                    <p class="text-lg font-bold text-gray-800">2025年 H2 営業利益の黒字化</p>
                                                </div>
                                                <div class="p-6 bg-white shadow-xl rounded-2xl border border-gray-100">
                                                    <p class="text-sm font-black text-blue-600 mb-2 uppercase tracking-widest">Target 02</p>
                                                    <p class="text-lg font-bold text-gray-800">固定費の構造的削減（1,000億円）</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="bg-gray-900 p-10 rounded-3xl text-white shadow-2xl relative overflow-hidden">
                                            <div class="absolute right-0 bottom-0 opacity-10 text-[200px] leading-none transform translate-y-1/4 translate-x-1/4">
                                                <i class="fas fa-rocket"></i>
                                            </div>
                                            <h3 class="text-2xl font-black mb-8 border-b-4 border-blue-500 inline-block">部の方針</h3>
                                            <p class="text-xl font-medium leading-relaxed italic opacity-90">「エンジニアのこだわりを、顧客の『財布が開く価値』へと変換し、一台あたりの限界利益を最大化する」</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
