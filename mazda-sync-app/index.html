<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZDA Sync | Strategy Navigator</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        
        /* Tree Layout Styles */
        .tree-wrapper { padding: 60px; display: inline-block; transition: transform 0.2s ease-out; transform-origin: top left; }
        
        /* Connector Line System */
        .tree-container { display: flex; flex-direction: column; align-items: center; }
        .tree-children { padding-top: 40px; position: relative; display: flex; justify-content: center; }
        .tree-item { list-style-type: none; position: relative; padding: 40px 10px 0 10px; display: flex; flex-direction: column; align-items: center; }
        
        .tree-item::before, .tree-item::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #cbd5e1;
            width: 50%; height: 40px;
        }
        .tree-item::after {
            right: auto; left: 50%;
            border-left: 2px solid #cbd5e1;
        }
        
        .tree-item:only-child::after, .tree-item:only-child::before { display: none; }
        .tree-item:only-child { padding-top: 0; }
        .tree-item:first-child::before, .tree-item:last-child::after { border: 0 none; }
        .tree-item:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 5px 0 0; }
        .tree-item:first-child::after { border-radius: 5px 0 0 0; }

        .tree-children::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; height: 40px;
        }

        .node-card { width: 380px; z-index: 10; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; text-align: left; }
        .node-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        
        .node-card-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        .node-card-container::after {
            content: ''; position: absolute; bottom: -40px; left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; height: 40px;
        }
        .node-card-container.no-children::after { display: none; }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const STRATEGY_DATA = {
            id: "purpose",
            title: "マツダのブランド価値を向上させる",
            level: "大目標 (Goal)",
            type: "goal",
            children: [
                {
                    id: "2.1",
                    title: "2.1. A: カスタマー・エクスペリエンス（CX）の高度化",
                    level: "中項目 (Strategy)",
                    type: "strategy",
                    children: [
                        {
                            id: "2.1-A1",
                            title: "A-1. デジタル接点の融合 (MyMazda連携)",
                            level: "小項目 (Category)",
                            issues: [
                                {
                                    id: "2.1-A1-01",
                                    fileName: "2.1_A1_01_mymazda_data_sync.md",
                                    title: "MyMazda連携におけるリアルタイム車両データの同期要件定義",
                                    tasks: [
                                        { title: "車載コネクティッドユニットから取得可能なデータ項目の全リストアップ", done: false },
                                        { title: "プライバシーポリシーに準拠したデータ利用許諾フローのUX設計", done: false },
                                        { title: "サーバー負荷を考慮したデータ同期頻度の決定", done: false },
                                        { title: "取得データをCRMへ自動連携するためのAPI仕様案作成", done: false }
                                    ]
                                },
                                {
                                    id: "2.1-A1-02",
                                    fileName: "2.1_A1_02_drive_log_experience.md",
                                    title: "「走る歓び」を可視化するドライブログ体験のUI/UX設計",
                                    tasks: [
                                        { title: "滑らかな運転スコアを算出するアルゴリズム案", done: false },
                                        { title: "ドライブフォトログ機能の画面遷移図作成", done: false },
                                        { title: "オーナー間コミュニティ機能のコンセプト設計", done: false },
                                        { title: "「楽しく走ったか」を評価する新指標の定義", done: false }
                                    ]
                                }
                            ]
                        },
                        {
                            id: "2.1-A2",
                            title: "A-2. 次世代店舗体験（マツダWay店舗）の標準化",
                            level: "小項目 (Category)",
                            issues: [
                                {
                                    id: "2.1-A2-01",
                                    fileName: "2.1_A2_01_cx_audit_scorecard.md",
                                    title: "次世代マツダ店舗向け「CX監査（Audit）」スコアカードの開発",
                                    tasks: [
                                        { title: "既存CSIに代わる「ブランド体感度」質問項目の作成", done: false },
                                        { title: "試乗コースにおける「人馬一体」体感スポットの指定", done: false },
                                        { title: "エバンジェリスト制度の評価基準策定", done: false },
                                        { title: "デジタルと店舗の連携評価ロジック構築", done: false }
                                    ]
                                },
                                {
                                    id: "2.1-A2-02",
                                    fileName: "2.1_A2_02_brand_storytelling_video.md",
                                    title: "販売店スタッフ向け「ブランド・ストーリーテリング」研修動画の制作",
                                    tasks: [
                                        { title: "開発主査や匠のインタビューから「キラーフレーズ」の抽出", done: true },
                                        { title: "車種ごとの「語るべき物語」の台本化", done: true },
                                        { title: "マイクロラーニング形式の動画構成案", done: false },
                                        { title: "理解度確認クイズとフィードバックループの設計", done: false }
                                    ]
                                }
                            ]
                        }
                    ]
                },
                {
                    id: "2.2",
                    title: "2.2. B: バリューチェーン・ブランディング",
                    level: "中項目 (Strategy)",
                    type: "strategy",
                    children: [
                        {
                            id: "2.2-B1",
                            title: "B-1. リセールバリュー管理戦略",
                            level: "小項目 (Category)",
                            issues: [
                                {
                                    id: "2.2-B1-01",
                                    fileName: "2.2_B1_01_resale_value_monitoring.md",
                                    title: "北米・国内中古車市場におけるリセールバリュー予測・監視システム",
                                    tasks: [
                                        { title: "主要オークションサイトの価格データ取得API選定", done: false },
                                        { title: "標準相場からの乖離検知アラートロジック開発", done: false },
                                        { title: "流通調整プロセスの策定", done: false },
                                        { title: "下取り価格保証の損益シミュレーションモデル構築", done: false }
                                    ]
                                }
                            ]
                        },
                        {
                            id: "2.2-B2",
                            title: "B-2. 認定中古車 (CPO) のブランド再定義",
                            level: "小項目 (Category)",
                            issues: [
                                {
                                    id: "2.2-B2-01",
                                    fileName: "2.2_B2_01_cpo_premium_strategy.md",
                                    title: "認定中古車（CPO）プレミアム化に向けた新保証プログラム設計",
                                    tasks: [
                                        { title: "欧州プレミアムブランドのCPO保証ベンチマーク", done: false },
                                        { title: "100項目以上の精密点検・リフレッシュ基準策定", done: false },
                                        { title: "CPO版残価設定型ローンの設計", done: false },
                                        { title: "車両ヒストリー可視化UIの検討", done: false }
                                    ]
                                }
                            ]
                        }
                    ]
                },
                {
                    id: "2.3",
                    title: "2.3. C: エンゲージメント・マーケティング",
                    level: "中項目 (Strategy)",
                    type: "strategy",
                    children: [
                        {
                            id: "2.3-C1",
                            title: "C-1. オーナーコミュニティの活性化 (ファンベース)",
                            level: "小項目 (Category)",
                            issues: [
                                {
                                    id: "2.3-C1-01",
                                    fileName: "2.3_C1_01_fan_community_integration.md",
                                    title: "マツダファンフェスタ連携型オンラインコミュニティ設計",
                                    tasks: [
                                        { title: "限定デジタルコンテンツの配布設計", done: false },
                                        { title: "開発エンジニアとの「技術相談BBS」運営ルール", done: false },
                                        { title: "ファン自発オフ会のプラットフォーム要件定義", done: false },
                                        { title: "アンバサダー可視化とインセンティブ設計", done: false }
                                    ]
                                }
                            ]
                        },
                        {
                            id: "2.3-C2",
                            title: "C-2. 独自技術の「体験」への変換",
                            level: "小項目 (Category)",
                            issues: [
                                {
                                    id: "2.3-C2-01",
                                    fileName: "2.3_C2_01_jinba_ittai_experience.md",
                                    title: "試乗体験における「人馬一体」官能評価指標の導入",
                                    tasks: [
                                        { title: "心地よさを説明する接客トークの開発", done: false },
                                        { title: "生体反応を用いた「ワクワク度」の簡易測定実験", done: false },
                                        { title: "全国試乗コースの選定基準作成", done: false },
                                        { title: "顧客フィードバック用官能評価シートの設計", done: false }
                                    ]
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        const TreeView = ({ onNavigate }) => {
            const [scale, setScale] = useState(1);
            const [initialized, setInitialized] = useState(false);
            const containerRef = useRef(null);
            const treeRef = useRef(null);

            useEffect(() => {
                const autoScaleAndCenter = () => {
                    if (containerRef.current && treeRef.current) {
                        // まずスケール1で実際のサイズを測定
                        setScale(1);
                        
                        requestAnimationFrame(() => {
                            if (!containerRef.current || !treeRef.current) return;
                            
                            const containerWidth = containerRef.current.clientWidth;
                            const containerHeight = containerRef.current.clientHeight;
                            const treeWidth = treeRef.current.offsetWidth;
                            const treeHeight = treeRef.current.offsetHeight;
                            
                            // 余白を考慮してスケールを計算
                            const padding = 80;
                            const scaleX = (containerWidth - padding) / treeWidth;
                            const scaleY = (containerHeight - padding) / treeHeight;
                            
                            // ツリー全体が見えるスケール（最小0.4、最大1.0）
                            const optimalScale = Math.min(1.0, Math.max(0.4, Math.min(scaleX, scaleY)));
                            setScale(optimalScale);
                            setInitialized(true);
                            
                            // 中央寄せ
                            requestAnimationFrame(() => {
                                if (containerRef.current) {
                                    const scaledWidth = treeWidth * optimalScale;
                                    const offsetX = Math.max(0, (containerWidth - scaledWidth) / 2);
                                    containerRef.current.scrollLeft = 0;
                                    if (treeRef.current) {
                                        treeRef.current.style.marginLeft = `${offsetX}px`;
                                    }
                                }
                            });
                        });
                    }
                };
                
                const timer = setTimeout(autoScaleAndCenter, 100);
                window.addEventListener('resize', autoScaleAndCenter);
                return () => {
                    clearTimeout(timer);
                    window.removeEventListener('resize', autoScaleAndCenter);
                };
            }, []);

            const Node = ({ node }) => {
                const hasChildren = node.children && node.children.length > 0;
                const hasIssues = node.issues && node.issues.length > 0;
                const cardBase = "bg-white border-2 rounded-[2rem] p-8 shadow-sm";
                const cardColor = {
                    goal: "border-blue-500 bg-blue-50",
                    strategy: "border-slate-300",
                    category: "border-indigo-400"
                }[node.type] || "border-slate-200";

                return (
                    <div className="tree-container">
                        <div className={`node-card-container ${!hasChildren ? 'no-children' : ''}`}>
                            <div className={`${cardBase} ${cardColor} node-card`}>
                                <div className="mb-2">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{node.level}</span>
                                </div>
                                <h4 className="text-xl font-extrabold text-slate-800 leading-tight mb-4">{node.title}</h4>
                                
                                {hasIssues && (
                                    <div className="mt-4 pt-4 border-t border-slate-100 space-y-2">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Linked Issues</span>
                                        {node.issues.map(issue => (
                                            <div 
                                                key={issue.id} 
                                                onClick={() => onNavigate(issue)}
                                                className="p-3 rounded-xl bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-200 transition-all flex items-center justify-between group"
                                            >
                                                <span className="text-sm font-semibold text-slate-600 group-hover:text-blue-600 truncate pr-2">{issue.title}</span>
                                                <i className="fas fa-arrow-right text-[10px] text-slate-300 group-hover:text-blue-400"></i>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {hasChildren && (
                            <div className="tree-children">
                                {node.children.map(child => (
                                    <div className="tree-item" key={child.id}>
                                        <Node node={child} />
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            const resetView = () => {
                if (containerRef.current && treeRef.current) {
                    const containerWidth = containerRef.current.clientWidth;
                    const containerHeight = containerRef.current.clientHeight;
                    const treeWidth = treeRef.current.offsetWidth / scale;
                    const treeHeight = treeRef.current.offsetHeight / scale;
                    
                    const padding = 80;
                    const scaleX = (containerWidth - padding) / treeWidth;
                    const scaleY = (containerHeight - padding) / treeHeight;
                    const optimalScale = Math.min(1.0, Math.max(0.4, Math.min(scaleX, scaleY)));
                    setScale(optimalScale);
                    
                    requestAnimationFrame(() => {
                        if (containerRef.current && treeRef.current) {
                            const scaledWidth = treeWidth * optimalScale;
                            const offsetX = Math.max(0, (containerWidth - scaledWidth) / 2);
                            containerRef.current.scrollLeft = 0;
                            treeRef.current.style.marginLeft = `${offsetX}px`;
                        }
                    });
                }
            };

            return (
                <div className="h-full flex flex-col">
                    <div className="flex items-center justify-end px-10 py-3 bg-white border-b border-slate-100 shrink-0">
                        <div className="flex items-center space-x-4 bg-slate-50 p-1 rounded-2xl border border-slate-200">
                            <button onClick={resetView} className="w-10 h-10 hover:bg-slate-100 rounded-xl transition-colors text-slate-600" title="Reset View">
                                <i className="fas fa-compress-arrows-alt"></i>
                            </button>
                            <div className="h-6 w-[1px] bg-slate-200"></div>
                            <button onClick={() => setScale(s => Math.max(0.3, s - 0.1))} className="w-10 h-10 hover:bg-slate-100 rounded-xl transition-colors text-slate-600"><i className="fas fa-search-minus"></i></button>
                            <span className="text-xs font-bold w-12 text-center text-slate-600">{Math.round(scale * 100)}%</span>
                            <button onClick={() => setScale(s => Math.min(1.5, s + 0.1))} className="w-10 h-10 hover:bg-slate-100 rounded-xl transition-colors text-slate-600"><i className="fas fa-search-plus"></i></button>
                        </div>
                    </div>

                    <main ref={containerRef} className="flex-1 overflow-auto bg-[#f8fafc]">
                        <div 
                            ref={treeRef} 
                            className="tree-wrapper" 
                            style={{ 
                                transform: `scale(${scale})`,
                                opacity: initialized ? 1 : 0,
                                transition: 'opacity 0.3s ease-out, transform 0.2s ease-out'
                            }}
                        >
                            <Node node={STRATEGY_DATA} />
                        </div>
                    </main>
                </div>
            );
        };

        const TaskSearchView = ({ onNavigate }) => {
            const [searchTerm, setSearchTerm] = useState('');
            
            const allTasks = [];
            const traverseTree = (node, path = []) => {
                if (node.issues) {
                    node.issues.forEach(issue => {
                        issue.tasks.forEach((task, idx) => {
                            allTasks.push({ issue, task, taskIndex: idx, path: [...path, node.title] });
                        });
                    });
                }
                if (node.children) {
                    node.children.forEach(child => traverseTree(child, [...path, node.title]));
                }
            };
            traverseTree(STRATEGY_DATA);
            
            const filteredTasks = allTasks.filter(item => 
                item.task.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                item.issue.title.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            return (
                <div className="h-full overflow-y-auto">
                    <div className="p-10 max-w-5xl mx-auto">
                        <div className="mb-8">
                            <h2 className="text-4xl font-black text-slate-900 mb-4">タスク検索</h2>
                            <div className="relative">
                                <i className="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input
                                    type="text"
                                    placeholder="タスク名またはIssue名で検索..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-16 pr-6 py-5 text-lg border-2 border-slate-200 rounded-3xl focus:border-blue-500 focus:outline-none transition-colors"
                                />
                            </div>
                        </div>
                        
                        <div className="space-y-4 pb-10">
                            {filteredTasks.map((item, idx) => (
                                <div key={idx} className="bg-white rounded-3xl border-2 border-slate-100 p-6 hover:border-blue-200 transition-all">
                                    <div className="flex items-start justify-between mb-3">
                                        <div className="flex-1">
                                            <div className="text-xs text-slate-400 font-bold uppercase tracking-widest mb-2">
                                                {item.path.slice(1).join(' > ')}
                                            </div>
                                            <button 
                                                onClick={() => onNavigate(item.issue)}
                                                className="text-lg font-bold text-blue-600 hover:text-blue-700 text-left mb-2"
                                            >
                                                {item.issue.title} <i className="fas fa-external-link-alt text-xs ml-2"></i>
                                            </button>
                                        </div>
                                        {item.task.done && (
                                            <span className="text-[10px] font-bold text-blue-600 uppercase tracking-widest bg-blue-50 px-3 py-1 rounded-full">
                                                Completed
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center space-x-4">
                                        <div className={`w-6 h-6 rounded-lg flex items-center justify-center border-2 ${item.task.done ? 'bg-blue-600 border-blue-600' : 'border-slate-300'}`}>
                                            {item.task.done && <i className="fas fa-check text-xs text-white"></i>}
                                        </div>
                                        <span className={`text-base font-semibold ${item.task.done ? 'text-slate-400 line-through' : 'text-slate-700'}`}>
                                            {item.task.title}
                                        </span>
                                    </div>
                                </div>
                            ))}
                            
                            {filteredTasks.length === 0 && (
                                <div className="text-center py-20">
                                    <i className="fas fa-search text-6xl text-slate-200 mb-4"></i>
                                    <p className="text-xl text-slate-400 font-semibold">
                                        {searchTerm ? '該当するタスクが見つかりませんでした' : '検索キーワードを入力してください'}
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ProgressView = () => {
            const calculateProgress = (node) => {
                let total = 0;
                let completed = 0;
                
                const traverse = (n) => {
                    if (n.issues) {
                        n.issues.forEach(issue => {
                            issue.tasks.forEach(task => {
                                total++;
                                if (task.done) completed++;
                            });
                        });
                    }
                    if (n.children) {
                        n.children.forEach(child => traverse(child));
                    }
                };
                
                traverse(node);
                return { total, completed, percentage: total > 0 ? Math.round((completed / total) * 100) : 0 };
            };
            
            const overallProgress = calculateProgress(STRATEGY_DATA);
            
            return (
                <div className="h-full overflow-y-auto">
                    <div className="p-10 max-w-5xl mx-auto pb-20">
                        <div className="mb-12">
                            <h2 className="text-4xl font-black text-slate-900 mb-8">進捗率ダッシュボード</h2>
                            
                            <div className="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-[3rem] p-12 border-2 border-blue-200 mb-8">
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="text-3xl font-black text-slate-900">全体進捗</h3>
                                    <div className="text-6xl font-black text-blue-600">{overallProgress.percentage}%</div>
                                </div>
                                <div className="h-8 bg-white rounded-full overflow-hidden border-2 border-blue-200 mb-4">
                                    <div 
                                        className="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-500"
                                        style={{ width: `${overallProgress.percentage}%` }}
                                    ></div>
                                </div>
                                <p className="text-lg font-semibold text-slate-600">
                                    {overallProgress.completed} / {overallProgress.total} タスク完了
                                </p>
                            </div>
                        </div>
                        
                        <div className="space-y-6">
                            {STRATEGY_DATA.children.map(strategy => {
                                const progress = calculateProgress(strategy);
                                return (
                                    <div key={strategy.id} className="bg-white rounded-3xl border-2 border-slate-100 p-8">
                                        <div className="flex items-center justify-between mb-4">
                                            <h4 className="text-2xl font-bold text-slate-800">{strategy.title}</h4>
                                            <div className="text-4xl font-black text-slate-600">{progress.percentage}%</div>
                                        </div>
                                        <div className="h-6 bg-slate-100 rounded-full overflow-hidden mb-4">
                                            <div 
                                                className="h-full bg-gradient-to-r from-blue-400 to-indigo-400 transition-all duration-500"
                                                style={{ width: `${progress.percentage}%` }}
                                            ></div>
                                        </div>
                                        <p className="text-sm font-semibold text-slate-500">
                                            {progress.completed} / {progress.total} タスク完了
                                        </p>
                                        
                                        {strategy.children && (
                                            <div className="mt-6 pl-6 space-y-3 border-l-2 border-slate-200">
                                                {strategy.children.map(category => {
                                                    const catProgress = calculateProgress(category);
                                                    return (
                                                        <div key={category.id} className="flex items-center justify-between">
                                                            <span className="text-sm font-semibold text-slate-600">{category.title}</span>
                                                            <div className="flex items-center space-x-3">
                                                                <div className="w-32 h-2 bg-slate-100 rounded-full overflow-hidden">
                                                                    <div 
                                                                        className="h-full bg-blue-500"
                                                                        style={{ width: `${catProgress.percentage}%` }}
                                                                    ></div>
                                                                </div>
                                                                <span className="text-sm font-bold text-slate-500 w-12 text-right">{catProgress.percentage}%</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const DetailView = ({ issue, onBack }) => {
            return (
                <div className="h-full flex flex-col bg-white fade-in">
                    <header className="h-16 flex items-center justify-between px-10 border-b border-slate-100 shrink-0">
                        <button onClick={onBack} className="flex items-center space-x-3 text-slate-600 hover:text-blue-600 transition-colors">
                            <i className="fas fa-arrow-left"></i>
                            <span className="font-bold">戻る</span>
                        </button>
                        <div className="flex items-center space-x-3">
                            <i className="far fa-file-alt text-slate-400"></i>
                            <span className="text-xs font-mono text-slate-400">{issue.fileName}</span>
                        </div>
                    </header>
                    
                    <main className="flex-1 overflow-y-auto p-20 max-w-5xl mx-auto w-full">
                        <div className="mb-12">
                            <span className="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-[10px] font-bold rounded-lg uppercase tracking-widest mb-4">Strategic Issue Detail</span>
                            <h2 className="text-5xl font-black text-slate-900 leading-tight mb-6">{issue.title}</h2>
                            <div className="flex items-center space-x-4 text-slate-500">
                                <div className="flex items-center space-x-2">
                                    <i className="far fa-id-badge"></i>
                                    <span className="text-sm font-bold">{issue.id}</span>
                                </div>
                                <div className="w-1 h-1 bg-slate-300 rounded-full"></div>
                                <div className="flex items-center space-x-2">
                                    <i className="far fa-clock"></i>
                                    <span className="text-sm font-bold">2026年度 実行計画</span>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-50 rounded-[3rem] p-12 border border-slate-100">
                            <h3 className="text-2xl font-black text-slate-800 mb-8 flex items-center">
                                <i className="fas fa-tasks mr-4 text-blue-600"></i>
                                具体的な実行タスク (Tasks)
                            </h3>
                            <div className="space-y-6">
                                {issue.tasks.map((task, idx) => (
                                    <div key={idx} className="flex items-center space-x-6 p-6 bg-white rounded-3xl border border-slate-200 shadow-sm">
                                        <div className={`w-8 h-8 rounded-xl flex items-center justify-center border-2 transition-all ${task.done ? 'bg-blue-600 border-blue-600' : 'border-slate-300'}`}>
                                            {task.done && <i className="fas fa-check text-sm text-white"></i>}
                                        </div>
                                        <span className={`text-xl font-semibold flex-1 ${task.done ? 'text-slate-400 line-through' : 'text-slate-700'}`}>
                                            {task.title}
                                        </span>
                                        {task.done && <span className="text-[10px] font-bold text-blue-600 uppercase tracking-widest bg-blue-50 px-3 py-1 rounded-full">Completed</span>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState({ type: 'main', tab: 'tree', issue: null });

            const renderContent = () => {
                if (view.type === 'detail') {
                    return <DetailView issue={view.issue} onBack={() => setView({ type: 'main', tab: view.tab, issue: null })} />;
                }
                
                return (
                    <React.Fragment>
                        {view.tab === 'tree' && <TreeView onNavigate={(issue) => setView({ ...view, type: 'detail', issue })} />}
                        {view.tab === 'search' && <TaskSearchView onNavigate={(issue) => setView({ ...view, type: 'detail', issue })} />}
                        {view.tab === 'progress' && <ProgressView />}
                    </React.Fragment>
                );
            };

            return (
                <div className="h-screen flex flex-col">
                    {/* Header */}
                    <header className="h-20 glass-header flex items-center justify-between px-10 z-50 shrink-0">
                        <div className="flex items-center space-x-6">
                            <h1 className="text-2xl font-black italic tracking-tighter text-slate-900">MAZDA <span className="text-blue-600">SYNC</span></h1>
                            <div className="h-6 w-[1px] bg-slate-200"></div>
                            <span className="text-sm font-bold text-slate-500">2026年度 戦略ナビゲーター</span>
                        </div>
                        
                        {view.type !== 'detail' && (
                            <div className="flex items-center space-x-2 bg-slate-50 p-1 rounded-2xl border border-slate-200">
                                <button 
                                    onClick={() => setView({ ...view, tab: 'tree' })}
                                    className={`px-6 py-2 rounded-xl font-bold text-sm transition-all ${view.tab === 'tree' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    <i className="fas fa-sitemap mr-2"></i>ツリー表示
                                </button>
                                <button 
                                    onClick={() => setView({ ...view, tab: 'search' })}
                                    className={`px-6 py-2 rounded-xl font-bold text-sm transition-all ${view.tab === 'search' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    <i className="fas fa-search mr-2"></i>タスク検索
                                </button>
                                <button 
                                    onClick={() => setView({ ...view, tab: 'progress' })}
                                    className={`px-6 py-2 rounded-xl font-bold text-sm transition-all ${view.tab === 'progress' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    <i className="fas fa-chart-line mr-2"></i>進捗率確認
                                </button>
                            </div>
                        )}
                    </header>

                    {/* Main Content - Takes remaining height and allows scroll */}
                    <main className="flex-1 overflow-hidden bg-[#f8fafc]">
                        {renderContent()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
