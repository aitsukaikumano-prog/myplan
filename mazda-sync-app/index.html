<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        /* --- 完璧なツリーコネクタのCSS --- */
        .tree-container { min-width: 7500px; padding: 100px; transition: transform 0.2s ease-out; transform-origin: top center; }
        
        .tree ul {
            padding-top: 40px; position: relative;
            transition: all 0.5s;
            display: flex;
            justify-content: center;
        }

        .tree li {
            float: left; text-align: center;
            list-style-type: none;
            position: relative;
            padding: 40px 10px 0 10px;
            transition: all 0.5s;
        }

        /* 親から伸びる垂直線 */
        .tree li::before, .tree li::after {
            content: '';
            position: absolute; top: 0; right: 50%;
            border-top: 3px solid #cbd5e1;
            width: 50%; height: 40px;
        }
        .tree li::after {
            right: auto; left: 50%;
            border-left: 3px solid #cbd5e1;
        }

        /* 兄弟がいない場合や端の処理 */
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after {
            border: 0 none;
        }
        .tree li:last-child::before {
            border-right: 3px solid #cbd5e1;
            border-radius: 0 5px 0 0;
        }
        .tree li:first-child::after {
            border-radius: 5px 0 0 0;
        }

        /* 子から親へ向かう線 */
        .tree ul ul::before {
            content: '';
            position: absolute; top: 0; left: 50%;
            border-left: 3px solid #cbd5e1;
            width: 0; height: 40px;
        }
        /* --- コネクタCSS終了 --- */

        .tree-node { min-width: 320px; transition: all 0.2s ease-out; }
        .active-sidebar { background: rgba(37, 99, 235, 0.1); color: #2563eb; border-right: 4px solid #2563eb; }
        .issue-tag { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Zoom Controls Overlay */
        .zoom-controls {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .zoom-btn {
            width: 50px;
            height: 50px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            display: flex;
            items-center: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #475569;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.2s;
        }
        .zoom-btn:hover {
            background: #f8fafc;
            border-color: #2563eb;
            color: #2563eb;
            transform: translateY(-2px);
        }
        .zoom-level {
            background: #2563eb;
            color: white;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

</body>
</html>
