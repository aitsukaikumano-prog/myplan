<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        
        /* Tree Layout Styles */
        .tree-wrapper { padding: 60px; display: inline-block; transition: transform 0.2s ease-out; transform-origin: top left; }
        
        /* Connector Line System */
        .tree-container { display: flex; flex-direction: column; align-items: center; }
        .tree-children { padding-top: 40px; position: relative; display: flex; justify-content: center; }
        .tree-item { list-style-type: none; position: relative; padding: 40px 10px 0 10px; display: flex; flex-direction: column; align-items: center; }
        
        .tree-item::before, .tree-item::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #cbd5e1;
            width: 50%; height: 40px;
        }
        .tree-item::after {
            right: auto; left: 50%;
            border-left: 2px solid #cbd5e1;
        }
        
        .tree-item:only-child::after, .tree-item:only-child::before { display: none; }
        .tree-item:only-child { padding-top: 0; }
        .tree-item:first-child::before, .tree-item:last-child::after { border: 0 none; }
        .tree-item:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 5px 0 0; }
        .tree-item:first-child::after { border-radius: 5px 0 0 0; }

        .tree-children::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; height: 40px;
        }

        .node-card { width: 380px; z-index: 10; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; text-align: left; }
        .node-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        
        .node-card-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        .node-card-container::after {
            content: ''; position: absolute; bottom: -40px; left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; height: 40px;
        }
        .node-card-container.no-children::after { display: none; }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>

                {

                    type: "strategy",
                    children: [
                        {

                            level: "小項目 (Category)",
                            issues: [

                        {

                            level: "小項目 (Category)",
                            issues: [
                                {

                                    fileName: "2.3_C2_01_jinba_ittai_experience.md",
                                    title: "試乗体験における「人馬一体」官能評価指標の導入",
                                    tasks: [

                                        { title: "生体反応を用いた「ワクワク度」の簡易測定実験", done: false },
                                        { title: "全国試乗コースの選定基準作成", done: false },

                                    ]
                                }
                            ]

                }

        };

        // タスクステータスの定義
        const TASK_STATUS = {
            PENDING: 'pending',           // 未着手
            IN_PROGRESS: 'in_progress',   // 作業中
            PENDING_APPROVAL: 'pending_approval', // 承認待ち
            COMPLETED: 'completed'        // 完了
        };
        
        const STATUS_CONFIG = {
            [TASK_STATUS.PENDING]: { label: '未着手', color: 'bg-slate-100 text-slate-500 border-slate-200', icon: 'far fa-circle' },
            [TASK_STATUS.IN_PROGRESS]: { label: '作業中', color: 'bg-amber-50 text-amber-600 border-amber-200', icon: 'fas fa-spinner' },
            [TASK_STATUS.PENDING_APPROVAL]: { label: '承認待ち', color: 'bg-purple-50 text-purple-600 border-purple-200', icon: 'fas fa-clock' },
            [TASK_STATUS.COMPLETED]: { label: '完了', color: 'bg-green-50 text-green-600 border-green-200', icon: 'fas fa-check' }
        };

        // LocalStorageからタスク状態を読み込み/保存するユーティリティ
        const STORAGE_KEY = 'mazda-sync-task-states-v2';
        
        const loadTaskStates = () => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch {
                return {};
            }
        };
        
        const saveTaskStates = (states) => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(states));
        };
        
        // タスク状態をデータに適用
        const applyTaskStates = (data, states) => {
            const clone = JSON.parse(JSON.stringify(data));
            
            const traverse = (node) => {
                if (node.issues) {
                    node.issues.forEach(issue => {
                        issue.tasks.forEach((task, idx) => {
                            const key = `${issue.id}-${idx}`;
                            if (states[key]) {
                                task.status = states[key].status || (task.done ? TASK_STATUS.COMPLETED : TASK_STATUS.PENDING);
                                task.deliverable = states[key].deliverable || null;
                                task.approvedAt = states[key].approvedAt || null;
                                task.approvedBy = states[key].approvedBy || null;
                            } else {
                                // 初期データから変換
                                task.status = task.done ? TASK_STATUS.COMPLETED : TASK_STATUS.PENDING;
                                task.deliverable = null;
                            }
                        });
                    });
                }
                if (node.children) {
                    node.children.forEach(child => traverse(child));
                }
            };
            
            traverse(clone);
            return clone;
        };
        
        // 変更されたファイルを検出
        const getChangedFiles = (data, initialData) => {
            const changes = [];
            
            const traverseBoth = (node, initNode) => {
                if (node.issues && initNode.issues) {
                    node.issues.forEach((issue, issueIdx) => {
                        const initIssue = initNode.issues[issueIdx];
                        const changedTasks = [];
                        
                        issue.tasks.forEach((task, taskIdx) => {
                            const initTask = initIssue.tasks[taskIdx];
                            const initStatus = initTask.done ? TASK_STATUS.COMPLETED : TASK_STATUS.PENDING;
                            if (task.status !== initStatus) {
                                changedTasks.push({ 
                                    title: task.title, 
                                    status: task.status, 
                                    deliverable: task.deliverable,
                                    index: taskIdx 
                                });
                            }
                        });
                        
                        if (changedTasks.length > 0) {
                            changes.push({ issue, changedTasks });
                        }
                    });
                }
                if (node.children && initNode.children) {
                    node.children.forEach((child, idx) => traverseBoth(child, initNode.children[idx]));
                }
            };
            
            traverseBoth(data, initialData);
            return changes;
        };

        const TreeView = ({ strategyData, onNavigate }) => {
            const [scale, setScale] = useState(1);
            const [initialized, setInitialized] = useState(false);
            const containerRef = useRef(null);
            const treeRef = useRef(null);

            useEffect(() => {
                const autoScaleAndCenter = () => {
                    if (containerRef.current && treeRef.current) {
                        // まずスケール1で実際のサイズを測定
                        setScale(1);
                        
                        requestAnimationFrame(() => {
                            if (!containerRef.current || !treeRef.current) return;
                            
                            const containerWidth = containerRef.current.clientWidth;
                            const containerHeight = containerRef.current.clientHeight;
                            const treeWidth = treeRef.current.offsetWidth;
                            const treeHeight = treeRef.current.offsetHeight;
                            
                            // 余白を考慮してスケールを計算
                            const padding = 80;
                            const scaleX = (containerWidth - padding) / treeWidth;
                            const scaleY = (containerHeight - padding) / treeHeight;
                            
                            // ツリー全体が見えるスケール（最小0.4、最大1.0）
                            const optimalScale = Math.min(1.0, Math.max(0.4, Math.min(scaleX, scaleY)));
                            setScale(optimalScale);
                            setInitialized(true);
                            
                            // 中央寄せ
                            requestAnimationFrame(() => {
                                if (containerRef.current) {
                                    const scaledWidth = treeWidth * optimalScale;
                                    const offsetX = Math.max(0, (containerWidth - scaledWidth) / 2);
                                    containerRef.current.scrollLeft = 0;
                                    if (treeRef.current) {
                                        treeRef.current.style.marginLeft = `${offsetX}px`;
                                    }
                                }
                            });
                        });
                    }
                };
                
                const timer = setTimeout(autoScaleAndCenter, 100);
                window.addEventListener('resize', autoScaleAndCenter);
                return () => {
                    clearTimeout(timer);
                    window.removeEventListener('resize', autoScaleAndCenter);
                };
            }, []);

            const Node = ({ node }) => {
                const hasChildren = node.children && node.children.length > 0;
                const hasIssues = node.issues && node.issues.length > 0;
                const cardBase = "bg-white border-2 rounded-[2rem] p-8 shadow-sm";
                const cardColor = {
                    goal: "border-blue-500 bg-blue-50",
                    strategy: "border-slate-300",
                    category: "border-indigo-400"
                }[node.type] || "border-slate-200";

                return (
                    <div className="tree-container">
                        <div className={`node-card-container ${!hasChildren ? 'no-children' : ''}`}>
                            <div className={`${cardBase} ${cardColor} node-card`}>
                                <div className="mb-2">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{node.level}</span>
                                </div>
                                <h4 className="text-xl font-extrabold text-slate-800 leading-tight mb-4">{node.title}</h4>
                                
                                {hasIssues && (
                                    <div className="mt-4 pt-4 border-t border-slate-100 space-y-2">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Linked Issues</span>
                                        {node.issues.map(issue => (
                                            <div 
                                                key={issue.id} 
                                                onClick={() => onNavigate(issue)}
                                                className="p-3 rounded-xl bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-200 transition-all flex items-center justify-between group"
                                            >
                                                <span className="text-sm font-semibold text-slate-600 group-hover:text-blue-600 truncate pr-2">{issue.title}</span>
                                                <i className="fas fa-arrow-right text-[10px] text-slate-300 group-hover:text-blue-400"></i>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {hasChildren && (
                            <div className="tree-children">
                                {node.children.map(child => (
                                    <div className="tree-item" key={child.id}>
                                        <Node node={child} />
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            const resetView = () => {
                if (containerRef.current && treeRef.current) {
                    const containerWidth = containerRef.current.clientWidth;
                    const containerHeight = containerRef.current.clientHeight;
                    const treeWidth = treeRef.current.offsetWidth / scale;
                    const treeHeight = treeRef.current.offsetHeight / scale;
                    
                    const padding = 80;
                    const scaleX = (containerWidth - padding) / treeWidth;
                    const scaleY = (containerHeight - padding) / treeHeight;
                    const optimalScale = Math.min(1.0, Math.max(0.4, Math.min(scaleX, scaleY)));
                    setScale(optimalScale);
                    
                    requestAnimationFrame(() => {
                        if (containerRef.current && treeRef.current) {
                            const scaledWidth = treeWidth * optimalScale;
                            const offsetX = Math.max(0, (containerWidth - scaledWidth) / 2);
                            containerRef.current.scrollLeft = 0;
                            treeRef.current.style.marginLeft = `${offsetX}px`;
                        }
                    });
                }
            };

            return (
                <div className="h-full flex flex-col">
                    <div className="flex items-center justify-end px-10 py-3 bg-white border-b border-slate-100 shrink-0">
                        <div className="flex items-center space-x-4 bg-slate-50 p-1 rounded-2xl border border-slate-200">
                            <button onClick={resetView} className="w-10 h-10 hover:bg-slate-100 rounded-xl transition-colors text-slate-600" title="Reset View">
                                <i className="fas fa-compress-arrows-alt"></i>
                            </button>
                            <div className="h-6 w-[1px] bg-slate-200"></div>
                            <button onClick={() => setScale(s => Math.max(0.3, s - 0.1))} className="w-10 h-10 hover:bg-slate-100 rounded-xl transition-colors text-slate-600"><i className="fas fa-search-minus"></i></button>
                            <span className="text-xs font-bold w-12 text-center text-slate-600">{Math.round(scale * 100)}%</span>
                            <button onClick={() => setScale(s => Math.min(1.5, s + 0.1))} className="w-10 h-10 hover:bg-slate-100 rounded-xl transition-colors text-slate-600"><i className="fas fa-search-plus"></i></button>
                        </div>
                    </div>

                    <main ref={containerRef} className="flex-1 overflow-auto bg-[#f8fafc]">
                        <div 
                            ref={treeRef} 
                            className="tree-wrapper" 
                            style={{ 
                                transform: `scale(${scale})`,
                                opacity: initialized ? 1 : 0,
                                transition: 'opacity 0.3s ease-out, transform 0.2s ease-out'
                            }}
                        >
                            <Node node={strategyData} />
                        </div>
                    </main>
                </div>
            );
        };

        const TaskSearchView = ({ strategyData, onNavigate }) => {
            const [searchTerm, setSearchTerm] = useState('');
            
            // Issue単位で収集
            const allIssues = [];
            const traverseTree = (node, path = []) => {
                if (node.issues) {
                    node.issues.forEach(issue => {
                        allIssues.push({ issue, path: [...path, node.title] });
                    });
                }
                if (node.children) {
                    node.children.forEach(child => traverseTree(child, [...path, node.title]));
                }
            };
            traverseTree(strategyData);
            
            // 検索フィルタリング（Issue単位）
            const filteredIssues = allIssues.filter(item => {
                const matchIssue = item.issue.title.toLowerCase().includes(searchTerm.toLowerCase());
                const matchTask = item.issue.tasks.some(task => 
                    task.title.toLowerCase().includes(searchTerm.toLowerCase())
                );
                return matchIssue || matchTask;
            });
            
            return (
                <div className="h-full overflow-y-auto">
                    <div className="p-10 max-w-5xl mx-auto">
                        <div className="mb-8">
                            <h2 className="text-4xl font-black text-slate-900 mb-4">タスク検索</h2>
                            <div className="relative">
                                <i className="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input
                                    type="text"
                                    placeholder="タスク名またはIssue名で検索..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-16 pr-6 py-5 text-lg border-2 border-slate-200 rounded-3xl focus:border-blue-500 focus:outline-none transition-colors"
                                />
                            </div>
                        </div>

        const ProgressView = ({ strategyData }) => {
            const calculateProgress = (node) => {
                let total = 0;
                let counts = {
                    [TASK_STATUS.PENDING]: 0,
                    [TASK_STATUS.IN_PROGRESS]: 0,
                    [TASK_STATUS.PENDING_APPROVAL]: 0,
                    [TASK_STATUS.COMPLETED]: 0
                };
                
                const traverse = (n) => {
                    if (n.issues) {
                        n.issues.forEach(issue => {
                            issue.tasks.forEach(task => {
                                total++;
                                const status = task.status || TASK_STATUS.PENDING;
                                counts[status]++;
                            });
                        });
                    }
                    if (n.children) {
                        n.children.forEach(child => traverse(child));
                    }
                };
                
                traverse(node);
                const completed = counts[TASK_STATUS.COMPLETED];
                return { total, completed, counts, percentage: total > 0 ? Math.round((completed / total) * 100) : 0 };
            };
            
            const overallProgress = calculateProgress(strategyData);

                                            <div className="text-3xl font-black">{overallProgress.counts[key]}</div>
                                            <div className="text-sm font-bold"><i className={`${config.icon} mr-1`}></i>{config.label}</div>

            return (

                return `task: タスク状態を更新 (${summaries})`;
            };

                return changes.map(change => {
                    const tasksMarkdown = change.issue.tasks.map((t, i) => {
                        const status = t.status || TASK_STATUS.PENDING;
                        const isComplete = status === TASK_STATUS.COMPLETED;
                        const statusLabel = status === TASK_STATUS.PENDING_APPROVAL ? ' (承認待ち)' : '';
                        return `- [${isComplete ? 'x' : ' '}] ${t.title}${statusLabel}`;
                    }).join('\n');
                    
                    return {
                        fileName: change.issue.fileName,
                        path: `github_sim2/issues/${change.issue.fileName}`,
                        tasks: tasksMarkdown,
                        changedTasks: change.changedTasks
                    };
                });
            };
            
            const copyCommand = () => {
                const cmd = `cd /Users/daiki/plan && git add . && git commit -m "${generateCommitMessage()}" && git push origin main`;
                navigator.clipboard.writeText(cmd);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);

                            <button 
                                onClick={copyCommand}
                                className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors flex items-center"
                            >
                                <i className={`fas ${copied ? 'fa-check' : 'fa-copy'} mr-2`}></i>
                                {copied ? 'コピーしました！' : 'コマンドをコピー'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState({ type: 'main', tab: 'tree', issue: null });
            const [taskStates, setTaskStates] = useState(loadTaskStates());
            const [showSyncModal, setShowSyncModal] = useState(false);
            
            // タスク状態を適用したデータ
            const strategyData = applyTaskStates(INITIAL_STRATEGY_DATA, taskStates);
            
            // 変更されたファイルを検出
            const changedFiles = getChangedFiles(strategyData, INITIAL_STRATEGY_DATA);
            const hasChanges = changedFiles.length > 0;
            
            // タスク状態を更新
            const updateTaskStatus = useCallback((issueId, taskIndex, newStatus, deliverable = null) => {
                setTaskStates(prev => {
                    const key = `${issueId}-${taskIndex}`;
                    const currentState = prev[key] || {};
                    
                    const newState = {
                        ...currentState,
                        status: newStatus,
                        deliverable: deliverable || currentState.deliverable
                    };
                    
                    const newStates = { ...prev, [key]: newState };
                    saveTaskStates(newStates);
                    return newStates;
                });
            }, []);
            
            // タスクを承認
            const approveTask = useCallback((issueId, taskIndex) => {
                setTaskStates(prev => {
                    const key = `${issueId}-${taskIndex}`;
                    const currentState = prev[key] || {};
                    
                    const newState = {
                        ...currentState,
                        status: TASK_STATUS.COMPLETED,
                        approvedAt: new Date().toISOString(),
                        approvedBy: '上司' // 実際のシステムではログインユーザー名
                    };
                    
                    const newStates = { ...prev, [key]: newState };
                    saveTaskStates(newStates);
                    return newStates;
                });
            }, []);
            
            // 後方互換性のためのトグル関数（タスク検索で使用）
            const toggleTask = useCallback((issueId, taskIndex) => {
                setTaskStates(prev => {
                    const key = `${issueId}-${taskIndex}`;
                    const currentState = prev[key] || {};
                    const currentStatus = currentState.status || TASK_STATUS.PENDING;
                    
                    // 簡易トグル: pending <-> completed
                    const newStatus = currentStatus === TASK_STATUS.COMPLETED 
                        ? TASK_STATUS.PENDING 
                        : TASK_STATUS.COMPLETED;
                    
                    const newState = {
                        ...currentState,
                        status: newStatus,
                        approvedAt: newStatus === TASK_STATUS.COMPLETED ? new Date().toISOString() : null,
                        approvedBy: newStatus === TASK_STATUS.COMPLETED ? '直接完了' : null
                    };
                    
                    const newStates = { ...prev, [key]: newState };
                    saveTaskStates(newStates);
                    return newStates;
                });
            }, []);
            
            // 現在のIssueの最新状態を取得
            const getCurrentIssue = (originalIssue) => {
                if (!originalIssue) return null;
                const findIssue = (node) => {
                    if (node.issues) {
                        for (const issue of node.issues) {
                            if (issue.id === originalIssue.id) return issue;
                        }
                    }
                    if (node.children) {
                        for (const child of node.children) {
                            const found = findIssue(child);
                            if (found) return found;
                        }
                    }
                    return null;
                };
                return findIssue(strategyData);
            };

            const renderContent = () => {
                if (view.type === 'detail') {
                    const currentIssue = getCurrentIssue(view.issue);
                    return (
                        <DetailView 
                            issue={currentIssue} 
                            onBack={() => setView({ type: 'main', tab: view.tab, issue: null })} 
                            onUpdateTaskStatus={updateTaskStatus}
                            onApproveTask={approveTask}
                        />
                    );
                }
                
                return (
                    <React.Fragment>
                        {view.tab === 'tree' && <TreeView strategyData={strategyData} onNavigate={(issue) => setView({ ...view, type: 'detail', issue })} />}
                        {view.tab === 'search' && <TaskSearchView strategyData={strategyData} onNavigate={(issue) => setView({ ...view, type: 'detail', issue })} />}
                        {view.tab === 'progress' && <ProgressView strategyData={strategyData} />}
                    </React.Fragment>
                );
            };

            return (
                <div className="h-screen flex flex-col">
                    {/* Header */}
                    <header className="h-20 glass-header flex items-center justify-between px-10 z-50 shrink-0">
                        <div className="flex items-center space-x-6">
                            <h1 className="text-2xl font-black italic tracking-tighter text-slate-900">MAZDA <span className="text-blue-600">SYNC</span></h1>
                            <div className="h-6 w-[1px] bg-slate-200"></div>
                            <span className="text-sm font-bold text-slate-500">2026年度 戦略ナビゲーター</span>
                        </div>
                        
                        <div className="flex items-center space-x-4">
                            {view.type !== 'detail' && (
                                <div className="flex items-center space-x-2 bg-slate-50 p-1 rounded-2xl border border-slate-200">
                                    <button 
                                        onClick={() => setView({ ...view, tab: 'tree' })}
                                        className={`px-6 py-2 rounded-xl font-bold text-sm transition-all ${view.tab === 'tree' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        <i className="fas fa-sitemap mr-2"></i>ツリー表示
                                    </button>
                                    <button 
                                        onClick={() => setView({ ...view, tab: 'search' })}
                                        className={`px-6 py-2 rounded-xl font-bold text-sm transition-all ${view.tab === 'search' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        <i className="fas fa-search mr-2"></i>タスク検索
                                    </button>
                                    <button 
                                        onClick={() => setView({ ...view, tab: 'progress' })}
                                        className={`px-6 py-2 rounded-xl font-bold text-sm transition-all ${view.tab === 'progress' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        <i className="fas fa-chart-line mr-2"></i>進捗率確認
                                    </button>
                                </div>
                            )}
                            
                            {/* GitHub同期ボタン */}
                            <button 
                                onClick={() => setShowSyncModal(true)}
                                disabled={!hasChanges}
                                className={`px-5 py-2 rounded-xl font-bold text-sm flex items-center transition-all ${
                                    hasChanges 
                                        ? 'bg-green-600 hover:bg-green-700 text-white shadow-lg shadow-green-200' 
                                        : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                                }`}
                            >
                                <i className="fab fa-github mr-2"></i>
                                {hasChanges ? `変更を反映 (${changedFiles.length})` : '変更なし'}
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-hidden bg-[#f8fafc]">
                        {renderContent()}
                    </main>
                    
                    {/* Sync Modal */}
                    {showSyncModal && <SyncModal changes={changedFiles} onClose={() => setShowSyncModal(false)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
