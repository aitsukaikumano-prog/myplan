<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZDA Sync | True Hierarchical Matrix</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        /* 巨大ツリー用設定：作るの中に車種が入るためさらに幅が必要 */
        .tree-container { min-width: 18000px; padding: 150px; transition: transform 0.2s ease-out; transform-origin: top center; }
        
        .tree ul {
            padding-top: 80px; position: relative;
            display: flex;
            justify-content: center;
        }

        .tree li {
            float: left; text-align: center;
            list-style-type: none;
            position: relative;
            padding: 80px 30px 0 30px;
        }

        .tree li::before, .tree li::after {
            content: '';
            position: absolute; top: 0; right: 50%;
            border-top: 4px solid #cbd5e1;
            width: 50%; height: 80px;
        }
        .tree li::after {
            right: auto; left: 50%;
            border-left: 4px solid #cbd5e1;
        }

        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 4px solid #cbd5e1; border-radius: 0 15px 0 0; }
        .tree li:first-child::after { border-radius: 15px 0 0 0; }

        .tree ul ul::before {
            content: '';
            position: absolute; top: 0; left: 50%;
            border-left: 4px solid #cbd5e1;
            width: 0; height: 80px;
        }

        .tree-node { min-width: 400px; }
        .issue-tag { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .zoom-controls { position: fixed; bottom: 40px; right: 40px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .zoom-btn { width: 60px; height: 60px; background: white; border: 2px solid #e2e8f0; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #475569; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); transition: all 0.2s; }
        .zoom-btn:hover { border-color: #2563eb; color: #2563eb; transform: scale(1.1); }
        .zoom-level { background: #2563eb; color: white; font-size: 0.8rem; font-weight: 900; padding: 6px 12px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const generateStages = (modelName) => [
            {
                id: `${modelName}-FD`, title: `FD: ${modelName} 企画・要件定義`, level: "Development Stage",
                children: [
                    {
                        id: `${modelName}-FD-ELE`, title: "電気系部品開発", level: "Domain",
                        children: [
                            { id: `${modelName}-FD-ELE-ADAS`, title: "ADAS企画", level: "Sub-Domain", issues: [`${modelName} FD: 衝突回避アルゴリズム要件`, `${modelName} FD: カメラ・ミリ波配置`] },
                            { id: `${modelName}-FD-ELE-AUD`, title: "音響システム企画", level: "Sub-Domain", issues: [`${modelName} FD: 室内音響シミュレーション`, `${modelName} FD: マツダハーモニックサウンド定義`] }
                        ]
                    },
                    { id: `${modelName}-FD-PT`, title: "パワートレイン開発", level: "Domain", issues: [`${modelName} FD: 燃費・出力マッピング`] }
                ]
            },
            {
                id: `${modelName}-DC`, title: `DC: ${modelName} 設計完了・出図`, level: "Development Stage",
                children: [
                    {
                        id: `${modelName}-DC-ELE`, title: "電気系詳細設計", level: "Domain",
                        children: [
                            { id: `${modelName}-DC-ELE-ADAS`, title: "ADAS基板・図面", level: "Sub-Domain", issues: [`${modelName} DC: ECU回路図面確定`, `${modelName} DC: ハーネスレイアウト出図`] },
                            { id: `${modelName}-DC-ELE-AUD`, title: "音響コンポーネント設計", level: "Sub-Domain", issues: [`${modelName} DC: スピーカーBOX筐体設計`, `${modelName} DC: アンプ冷却設計`] }
                        ]
                    },
                    { id: `${modelName}-DC-NVH`, title: "NVH解析・対策", level: "Domain", issues: [`${modelName} DC: エンジン透過音解析`, `${modelName} DC: 防音材最適配置`] }
                ]
            }
        ];

        const STRATEGY_DATA = {
            id: "root", title: "前向きに今日を生きる人の輪を広げる", level: "Corporate Purpose", type: "purpose",
            children: [
                {
                    id: "Wing-Make", title: "A. Value Creation: 商品を作る (R&D/生産)", level: "Strategic Wing", type: "wing-make",
                    children: [
                        { id: "M-CX5", title: "CX-5 Project", level: "Model", type: "model", children: generateStages("CX-5") },
                        { id: "M-CX60", title: "CX-60 Project", level: "Model", type: "model", children: generateStages("CX-60") },
                        { id: "M-CX80", title: "CX-80 Project", level: "Model", type: "model", children: generateStages("CX-80") },
                        { id: "M-Roadster", title: "Roadster Project", level: "Model", type: "model", children: generateStages("Roadster") }
                    ]
                },
                {
                    id: "Wing-Sell", title: "B. Value Delivery: 商品を売る (販社/リセール)", level: "Strategic Wing", type: "wing-sell",
                    children: [
                        { id: "S-MKT", title: "グローバル・マーケティング", level: "Global Function", issues: ["北米広告ROI最適化", "ブランド価値浸透キャンペーン"] },
                        { id: "S-SLS", title: "販売・アフターサービス", level: "Global Function", issues: ["認定中古車制度の拡充", "整備知見のR&Dフィードバック"] },
                        { id: "S-RES", title: "リセール価値・残価管理", level: "Global Function", issues: ["3年残価率の5%向上施策", "値引き抑制ロジックの徹底"] }
                    ]
                }
            ]
        };

        const TreeNode = ({ node }) => {
            const hasChildren = node.children && node.children.length > 0;
            const hasIssues = node.issues && node.issues.length > 0;

            const getNodeStyle = () => {
                if (node.type === 'purpose') return 'bg-black border-black text-white';
                if (node.type === 'wing-make') return 'border-red-600 bg-red-50/20';
                if (node.type === 'wing-sell') return 'border-green-600 bg-green-50/20';
                if (node.type === 'model') return 'border-blue-800 bg-blue-50/10';
                if (node.level === 'Development Stage') return 'border-amber-600 bg-amber-50/5';
                if (node.level === 'Domain') return 'border-emerald-600 bg-emerald-50/5';
                return 'border-slate-200 hover:border-blue-400 bg-white';
            };

            return (
                <li>
                    <div className={`tree-node relative inline-block p-10 rounded-[3.5rem] shadow-2xl border-[6px] transition-all ${getNodeStyle()}`}>
                        <div className="mb-4">
                            <span className={`text-[12px] font-black uppercase tracking-[0.35em] ${
                                node.type === 'purpose' ? 'text-blue-400' : 'text-slate-400'
                            }`}>{node.level}</span>
                        </div>
                        <h4 className="text-[20px] font-black leading-tight italic uppercase tracking-tighter mb-2">{node.title}</h4>
                        
                        {hasIssues && (
                            <div className="mt-8 pt-8 border-t-2 border-dashed border-slate-200 space-y-3 text-left">
                                {node.issues.map((issue, idx) => (
                                    <div key={idx} className="issue-tag bg-slate-900 text-white text-[13px] p-5 rounded-3xl font-bold flex items-start shadow-xl border border-slate-700">
                                        <i className="fab fa-github mr-4 mt-1 text-blue-400 text-lg"></i>
                                        <span className="leading-snug tracking-tight">{issue}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {hasChildren && (
                        <ul>
                            {node.children.map(child => (
                                <TreeNode key={child.id} node={child} />
                            ))}
                        </ul>
                    )}
                </li>
            );
        };

        function App() {
            const [zoom, setZoom] = useState(0.15); 

            const zoomIn = () => setZoom(prev => Math.min(prev + 0.1, 1.5));
            const zoomOut = () => setZoom(prev => Math.max(prev - 0.1, 0.05));
            const resetZoom = () => setZoom(0.15);

            return (
                <div className="flex h-screen text-slate-800 bg-[#f8fafc] overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-80 glass border-r flex flex-col z-20 shadow-2xl flex-shrink-0">
                        <div className="p-10 text-center">
                            <h1 className="text-4xl font-black tracking-tighter text-slate-900 italic">MAZDA <span className="text-blue-600 uppercase">Sync</span></h1>
                            <p className="text-[11px] text-slate-400 font-bold uppercase tracking-[0.3em] mt-3">Enterprise Matrix OS</p>
                        </div>
                        <div className="flex-1 px-8 py-8 space-y-6">
                            <div className="bg-slate-900 text-white px-8 py-6 rounded-[2.5rem] flex items-center space-x-5 shadow-2xl">
                                <i className="fas fa-sitemap text-xl text-blue-400"></i>
                                <span className="font-black text-sm uppercase italic tracking-widest">Enterprise Wall</span>
                            </div>
                            <div className="space-y-4 px-6">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Logic Wings</p>
                                <div className="flex items-center space-x-3 text-xs font-bold text-red-600 italic">
                                    <div className="w-4 h-4 rounded-full bg-red-600"></div>
                                    <span>Value Creation (車種群)</span>
                                </div>
                                <div className="flex items-center space-x-3 text-xs font-bold text-green-600 italic">
                                    <div className="w-4 h-4 rounded-full bg-green-600"></div>
                                    <span>Value Delivery (全社機能)</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 overflow-auto relative scroll-smooth bg-slate-50">
                        <div className="zoom-controls">
                            <div className="zoom-level italic tracking-tighter">{Math.round(zoom * 100)}%</div>
                            <button onClick={zoomIn} className="zoom-btn" title="Zoom In"><i className="fas fa-plus"></i></button>
                            <button onClick={zoomOut} className="zoom-btn" title="Zoom Minus"><i className="fas fa-minus"></i></button>
                            <button onClick={resetZoom} className="zoom-btn" title="Reset"><i className="fas fa-compress-arrows-alt"></i></button>
                        </div>

                        <div 
                            className="tree tree-container"
                            style={{ 
                                transform: `scale(${zoom})`,
                                transformOrigin: 'top center',
                                paddingBottom: '1200px'
                            }}
                        >
                            <header className="mb-48 text-center">
                                <h2 className="text-[140px] font-black text-slate-900 tracking-tighter italic uppercase leading-none mb-10">Corporate Value Chain Matrix</h2>
                                <p className="text-6xl font-medium text-slate-400 leading-relaxed max-w-7xl mx-auto">
                                    「作る」の中に全車種・全工程を内包。マツダの事業実態を完全に同期。
                                </p>
                            </header>
                            <ul>
                                <TreeNode node={STRATEGY_DATA} />
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
