<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZDA Sync | Enterprise Strategic Navigator</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; overflow-x: auto; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .sidebar-item:hover { background: rgba(37, 99, 235, 0.1); color: #2563eb; }
        .active-sidebar { background: rgba(37, 99, 235, 0.1); color: #2563eb; border-right: 4px solid #2563eb; }
        .logic-line { width: 2px; background: #cbd5e1; margin: 0 auto; height: 20px; }
        .tree-node { transition: all 0.2s ease-out; }
        .issue-tag { animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* 横に長いツリーを表示するための調整 */
        .tree-container { min-width: 2500px; padding-bottom: 100px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const STRATEGY_DATA = {
            id: "root", title: "前向きに今日を生きる人の輪を広げる", level: "Purpose", type: "purpose",
            children: [
                {
                    id: "L2-1", title: "1. 限界利益の拡大 (+500億円)", level: "Strategic Engine", type: "engine",
                    children: [
                        {
                            id: "L3-1", title: "単価 (P) の向上・防衛", level: "Business Pillar",
                            children: [
                                {
                                    id: "L4-1", title: "中古車リセールバリューのシステム的防衛", level: "Program",
                                    issues: ["リセール予測モデルの精度向上", "認定中古車制度の再設計", "下取り価格シミュレーターの開発"]
                                },
                                {
                                    id: "L4-2", title: "WTP（支払い意欲）に基づいたオプション価格設定", level: "Program",
                                    issues: ["ADAS機能の価格受容性調査", "内装マテリアルの寄与度分析", "コンジョイント分析実施"]
                                }
                            ]
                        },
                        {
                            id: "L3-2", title: "数量 (Q) の確保・シェア拡大", level: "Business Pillar",
                            children: [
                                {
                                    id: "L4-3", title: "北米市場におけるCXシリーズの販促最適化", level: "Program",
                                    issues: ["地域別インセンティブ配分の最適化", "デジタル広告ROIの改善", "ディーラー在庫の回転率向上"]
                                }
                            ]
                        }
                    ]
                },
                {
                    id: "L2-2", title: "2. 固定費の構造改革 (-1,000億円)", level: "Strategic Engine", type: "engine",
                    children: [
                        {
                            id: "L3-3", title: "R&D費の効率化・スピード向上", level: "Business Pillar",
                            children: [
                                {
                                    id: "L4-4", title: "パワートレイン開発の試作レス化", level: "Technical Domain",
                                    children: [
                                        {
                                            id: "L5-1", title: "燃焼シミュレーションの高度化", level: "Tech Goal",
                                            issues: ["スーパーコンピュータ解析工数の削減", "実機テストとの相関誤差修正", "MBDモデルの共通化"]
                                        }
                                    ]
                                },
                                {
                                    id: "L4-5", title: "電子・ソフト基盤の共通プラットフォーム化", level: "Technical Domain",
                                    children: [
                                        {
                                            id: "L5-2", title: "次世代車載OS（Mazda OS）の基盤構築", level: "Tech Goal",
                                            issues: ["OTAアップデート機能の実装", "セキュリティプロトコルの策定", "UI/UXフレームワークの統一"]
                                        },
                                        {
                                            id: "L5-3", title: "先進安全（ADAS）知見の資産化", level: "Tech Goal",
                                            issues: ["不具合再現シナリオの自動生成", "検証走行データの圧縮・検索DX", "エッジAIアルゴリズムの軽量化"]
                                        }
                                    ]
                                }
                            ]
                        },
                        {
                            id: "L3-4", title: "販管費 (SG&A) の最適化", level: "Business Pillar",
                            children: [
                                {
                                    id: "L4-6", title: "事務・間接工数のAI自動化", level: "Business Program",
                                    issues: ["全社定型レポートの自動生成", "多段承認プロセスのデジタル化", "経費精算AIチェック導入"]
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        const TreeNode = ({ node }) => {
            const [isExpanded, setIsExpanded] = useState(node.level === "Purpose" || node.level === "Strategic Engine");
            const hasChildren = node.children && node.children.length > 0;
            const hasIssues = node.issues && node.issues.length > 0;

            return (
                <div className="flex flex-col items-center w-full mt-2">
                    <div className={`tree-node relative group max-w-sm w-full p-4 rounded-2xl shadow-sm border-2 transition-all ${
                        node.type === 'purpose' ? 'bg-gray-900 border-gray-900 text-white' : 
                        node.type === 'engine' ? 'bg-white border-blue-600' : 'bg-white border-gray-200 hover:border-blue-400'
                    }`}>
                        <div className="flex justify-between items-start mb-1">
                            <span className={`text-[8px] font-black uppercase tracking-widest ${
                                node.type === 'purpose' ? 'text-blue-400' : 'text-gray-400'
                            }`}>{node.level}</span>
                            {hasChildren && (
                                <button 
                                    onClick={() => setIsExpanded(!isExpanded)}
                                    className="w-5 h-5 rounded-full bg-gray-100 flex items-center justify-center text-gray-900 hover:bg-blue-600 hover:text-white transition-all shadow-sm"
                                >
                                    <i className={`fas ${isExpanded ? 'fa-minus' : 'fa-plus'} text-[8px]`}></i>
                                </button>
                            )}
                        </div>
                        <h4 className="text-[11px] font-black leading-tight italic">{node.title}</h4>
                        
                        {isExpanded && hasIssues && (
                            <div className="mt-4 pt-3 border-t border-dashed space-y-2">
                                <p className="text-[8px] font-black text-blue-500 uppercase tracking-widest mb-2">Connected Issues</p>
                                {node.issues.map((issue, idx) => (
                                    <div key={idx} className="issue-tag bg-blue-600 text-white text-[9px] p-2 rounded-lg font-bold flex items-center shadow-md border border-blue-400">
                                        <i className="fab fa-github mr-2"></i>
                                        <span className="truncate">{issue}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {isExpanded && hasChildren && (
                        <div className="w-full">
                            <div className="logic-line"></div>
                            <div className="flex justify-center space-x-4">
                                {node.children.map(child => (
                                    <TreeNode key={child.id} node={child} />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('strategy');

            return (
                <div className="flex h-screen text-gray-800">
                    {/* Sidebar */}
                    <div className="w-64 glass border-r flex flex-col z-20 shadow-xl flex-shrink-0">
                        <div className="p-6 text-center">
                            <h1 className="text-2xl font-black tracking-tighter text-gray-900 italic">MAZDA <span className="text-blue-600 uppercase">Sync</span></h1>
                            <p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">Enterprise Organizational OS</p>
                        </div>
                        <nav className="flex-1 mt-4">
                            {[
                                { id: 'strategy', icon: 'fa-bullseye', label: 'Strategy Core' },
                                { id: 'dashboard', icon: 'fa-chart-line', label: 'Sync Dashboard' },
                                { id: 'inbox', icon: 'fa-inbox', label: 'Team Inbox' },
                                { id: 'repository', icon: 'fa-folder-open', label: 'Repository' },
                            ].map(tab => (
                                <div key={tab.id} onClick={() => setActiveTab(tab.id)} 
                                     className={`sidebar-item px-6 py-4 cursor-pointer flex items-center space-x-3 transition-all ${activeTab === tab.id ? 'active-sidebar font-bold' : 'text-gray-500'}`}>
                                    <i className={`fas ${tab.icon} w-5`}></i>
                                    <span className="text-sm">{tab.label}</span>
                                </div>
                            ))}
                        </nav>
                        <div className="p-4 border-t text-[9px] text-gray-400 text-center uppercase font-bold tracking-[0.2em]">
                            Admin: <b>daiki</b>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 overflow-auto bg-gray-50 relative">
                        <div className="p-8">
                            {activeTab === 'strategy' && (
                                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                                    <header className="mb-12 text-center sticky top-0 bg-gray-50/80 backdrop-blur pb-4 z-10">
                                        <h2 className="text-3xl font-black text-gray-900 tracking-tight italic uppercase">Enterprise Strategy Navigator</h2>
                                        <p className="text-gray-500 mt-2 text-sm">マツダ再興に向けた全社目標から、エンジニア一人ひとりのタスクまでの論理連鎖。</p>
                                    </header>

                                    <div className="tree-container flex justify-center">
                                        <TreeNode node={STRATEGY_DATA} />
                                    </div>
                                </div>
                            )}

                            {activeTab === 'dashboard' && (
                                <div className="max-w-4xl mx-auto p-12 text-center">
                                    <i className="fas fa-chart-line text-8xl text-gray-200 mb-8"></i>
                                    <h3 className="text-2xl font-black italic mb-4">Dashboard under update...</h3>
                                    <p className="text-gray-400">戦略ツリーの拡張に伴い、ダッシュボード機能を同期中です。</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
