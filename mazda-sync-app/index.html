<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZDA Sync | Brand Strategy Tree</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tree-container { padding: 40px; }
        .logic-line { width: 2px; background: #cbd5e1; margin: 0 auto; height: 30px; }
        .node-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .node-card:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const BRAND_STRATEGY = {
            id: "G1", title: "マツダのブランド価値（プレミアム・バリュー）の最大化", level: "大目標 (Goal)", type: "goal",
            children: [
                {
                    id: "M1", title: "A. 感性品質の極致化 (作る価値)", level: "中項目 (Strategy)", type: "strategy",
                    children: [
                        {
                            id: "S1-1", title: "音響システム（原音再生の追求）", level: "小項目 (Category)", type: "category",
                            children: [
                                { id: "T1", title: "スピーカー配置のAI最適化", level: "タスク (Task)", type: "task", owner: "@akira" },
                                { id: "T2", title: "車内静粛性向上のための新素材検証", level: "タスク (Task)", type: "task", owner: "@kenji" }
                            ]
                        },
                        {
                            id: "S1-2", title: "デザインフィニッシュの向上", level: "小項目 (Category)", type: "category",
                            children: [
                                { id: "T3", title: "匠塗（TAKUMINURI）の量産化精度向上", level: "タスク (Task)", type: "task", owner: "@yoko" }
                            ]
                        }
                    ]
                },
                {
                    id: "M2", title: "B. 顧客生涯価値（LTV）の向上 (売る価値)", level: "中項目 (Strategy)", type: "strategy",
                    children: [
                        {
                            id: "S2-1", title: "リセール価値（残価率）の防衛", level: "小項目 (Category)", type: "category",
                            children: [
                                { id: "T4", title: "中古車価格予測AIの実装", level: "タスク (Task)", type: "task", owner: "@daiki" },
                                { id: "T5", title: "認定中古車ブランド規定の刷新", level: "タスク (Task)", type: "task", owner: "@mika" }
                            ]
                        }
                    ]
                },
                {
                    id: "M3", title: "C. 独自技術の物語化 (語る価値)", level: "中項目 (Strategy)", type: "strategy",
                    children: [
                        {
                            id: "S3-1", title: "ロータリーエンジン（発電機）の資産化", level: "小項目 (Category)", type: "category",
                            children: [
                                { id: "T6", title: "マルチソリューション戦略の広報DX", level: "タスク (Task)", type: "task", owner: "@satoshi" }
                            ]
                        }
                    ]
                }
            ]
        };

        const StrategyNode = ({ node }) => {
            const [isExpanded, setIsExpanded] = useState(true);
            const hasChildren = node.children && node.children.length > 0;

            return (
                <div className="flex flex-col items-center w-full">
                    <div className={`node-card p-6 rounded-3xl shadow-xl border-t-8 max-w-md w-full mb-2 bg-white ${
                        node.type === 'goal' ? 'border-black' : 
                        node.type === 'strategy' ? 'border-blue-600' : 
                        node.type === 'category' ? 'border-emerald-500' : 'border-slate-400'
                    }`}>
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">{node.level}</span>
                            {hasChildren && (
                                <button onClick={() => setIsExpanded(!isExpanded)} className="text-slate-300 hover:text-blue-600 transition-colors">
                                    <i className={`fas ${isExpanded ? 'fa-minus-square' : 'fa-plus-square'} text-lg`}></i>
                                </button>
                            )}
                        </div>
                        <h4 className={`font-black italic uppercase leading-tight ${node.type === 'goal' ? 'text-2xl' : 'text-lg'}`}>
                            {node.title}
                        </h4>
                        {node.owner && (
                            <div className="mt-4 flex items-center space-x-2">
                                <div className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-[10px] font-black">{node.owner[1].toUpperCase()}</div>
                                <span className="text-xs font-bold text-slate-500">{node.owner}</span>
                            </div>
                        )}
                    </div>
                    {isExpanded && hasChildren && (
                        <div className="w-full">
                            <div className="logic-line"></div>
                            <div className="flex justify-center items-start space-x-8 px-4">
                                {node.children.map(child => <StrategyNode key={child.id} node={child} />)}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('brand');

            return (
                <div className="min-h-screen p-12 bg-[#f8fafc]">
                    <header className="mb-20 text-center max-w-4xl mx-auto">
                        <div className="inline-block bg-black text-white px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest mb-6">Strategy Engine</div>
                        <h1 className="text-6xl font-black text-slate-900 tracking-tighter italic uppercase mb-6 leading-none">Brand Strategy<br/>Navigator</h1>
                        <p className="text-xl font-medium text-slate-500 leading-relaxed">
                            大目標を「ブランド価値向上」に据えた論理分解。全ての現場タスクは、マツダのプレミアム化のために存在する。
                        </p>
                    </header>

                    <div className="tree-container flex justify-center">
                        <StrategyNode node={BRAND_STRATEGY} />
                    </div>

                    <div className="fixed bottom-10 right-10 flex space-x-4">
                        <button className="bg-white border-2 border-slate-200 p-4 rounded-2xl shadow-lg hover:border-blue-600 transition-all text-slate-400 hover:text-blue-600">
                            <i className="fas fa-compress-arrows-alt"></i>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
