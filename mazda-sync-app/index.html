<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZDA Sync | Platform & Delta Navigator</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); }
        
        .tree-container { min-width: 5000px; padding: 100px; transition: transform 0.2s ease-out; transform-origin: top center; }
        .tree ul { padding-top: 60px; position: relative; display: flex; justify-content: center; }
        .tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 60px 20px 0 20px; }
        
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #475569; width: 50%; height: 60px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #475569; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid #475569; border-radius: 0 15px 0 0; }
        .tree li:first-child::after { border-radius: 15px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #475569; width: 0; height: 60px; }

        .node { min-width: 320px; padding: 24px; border-radius: 24px; border: 2px solid #334155; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .node:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.2); }
        
        .node-platform { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-color: #3b82f6; border-width: 3px; }
        .node-delta { background: #1e293b; border-color: #64748b; }
        .node-duplicate { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        
        .zoom-controls { position: fixed; bottom: 40px; right: 40px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .zoom-btn { width: 56px; height: 56px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: #94a3b8; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .zoom-btn:hover { background: #334155; color: #f8fafc; border-color: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const STRATEGY_DATA = {
            id: "purpose", title: "前向きに今日を生きる人の輪を広げる", level: "Corporate Purpose", type: "purpose",
            children: [
                {
                    id: "platform", title: "Shared Platform (共通資産リポジトリ)", level: "Core Assets", type: "platform",
                    description: "車種を跨いで共通化すべき『知見・部品・ソフト』の塊",
                    children: [
                        {
                            id: "p-ele", title: "電気電子・ソフトウェア共通基盤", level: "Domain Platform",
                            issues: [
                                "PLAT-ELE-01: Mazda OS 2.0 共通カーネル",
                                "PLAT-ELE-02: 共通ADASアルゴリズム (第3世代)",
                                "PLAT-ELE-03: 音響感性価値・標準評価プロトコル"
                            ],
                            children: [
                                {
                                    id: "cx60-ele", title: "CX-60 差分開発 (Delta)", level: "Model Specific", type: "delta",
                                    issues: ["DELTA-CX60: 大型SUV用カメラ画角最適化", "DELTA-CX60: インパネ形状に伴う音響補正"],
                                },
                                {
                                    id: "cx80-ele", title: "CX-80 差分開発 (Delta)", level: "Model Specific", type: "delta",
                                    issues: ["DELTA-CX80: 3列目空間の空調・音響最適化", "DUPLICATE!!: CX-60の図面を流用可能(検知済)"],
                                    isDuplicate: true
                                }
                            ]
                        },
                        {
                            id: "p-pt", title: "パワートレイン共通基盤", level: "Domain Platform",
                            issues: ["PLAT-PT-01: 直列6気筒エンジン基本設計", "PLAT-PT-02: 共通FRプラグインハイブリッドシステム"],
                            children: [
                                {
                                    id: "mx5-pt", title: "Roadster 独自開発 (Unique)", level: "Model Specific", type: "delta",
                                    issues: ["UNIQUE-ND: 軽量化特化型パワーユニット適合", "UNIQUE-ND: 官能的排気サウンドの調律"]
                                }
                            ]
                        }
                    ]
                },
                {
                    id: "sell", title: "Value Delivery (全社販売・リセール)", level: "Corporate Function", type: "platform",
                    description: "車種に依存しないブランド・ファイナンス戦略",
                    issues: ["SELL-01: 全車種共通リセール予測ロジック", "SELL-02: 認定中古車グローバル基準"]
                }
            ]
        };

        const TreeNode = ({ node }) => {
            const hasChildren = node.children && node.children.length > 0;
            const hasIssues = node.issues && node.issues.length > 0;

            return (
                <li>
                    <div className={`node relative inline-block text-left ${
                        node.type === 'purpose' ? 'bg-white text-black' : 
                        node.type === 'platform' ? 'node-platform' : 
                        node.isDuplicate ? 'node-duplicate' : 'node-delta'
                    }`}>
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-[10px] font-black uppercase tracking-widest text-blue-400">{node.level}</span>
                            {node.isDuplicate && (
                                <span className="bg-amber-500 text-black text-[9px] font-black px-2 py-0.5 rounded animate-pulse">REUSE ALERT</span>
                            )}
                        </div>
                        <h4 className="text-lg font-black italic uppercase leading-none mb-2">{node.title}</h4>
                        {node.description && <p className="text-xs text-slate-400 mb-4">{node.description}</p>}
                        
                        {hasIssues && (
                            <div className="space-y-2 border-t border-slate-700 pt-4 mt-2">
                                {node.issues.map((issue, idx) => (
                                    <div key={idx} className={`text-[11px] font-bold p-3 rounded-xl border ${
                                        issue.includes('DUPLICATE') ? 'border-amber-500/50 bg-amber-500/5 text-amber-200' : 'border-slate-700 bg-slate-800/50 text-slate-300'
                                    }`}>
                                        <i className={`fas ${issue.includes('DUPLICATE') ? 'fa-copy' : 'fa-tag'} mr-2`}></i>
                                        {issue}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {hasChildren && (
                        <ul>
                            {node.children.map(child => (
                                <TreeNode key={child.id} node={child} />
                            ))}
                        </ul>
                    )}
                </li>
            );
        };

        function App() {
            const [zoom, setZoom] = useState(0.7);

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className="w-80 glass border-r border-slate-800 flex flex-col z-20 shadow-2xl">
                        <div className="p-8">
                            <h1 className="text-2xl font-black italic tracking-tighter">MAZDA <span className="text-blue-500">SYNC</span></h1>
                            <p className="text-[10px] font-bold text-slate-500 tracking-[0.2em] mt-1 uppercase">Complexity Resolver</p>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            <div className="bg-blue-600/10 text-blue-400 px-6 py-4 rounded-2xl flex items-center space-x-4 border border-blue-500/20">
                                <i className="fas fa-microchip"></i>
                                <span className="font-black text-sm italic uppercase">Platform Central</span>
                            </div>
                        </nav>
                        <div className="p-8 border-t border-slate-800 space-y-4">
                            <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Management Strategy</div>
                            <div className="flex items-center space-x-3 text-xs">
                                <div className="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>
                                <span className="text-slate-300 font-bold">共通資産 (Platform)</span>
                            </div>
                            <div className="flex items-center space-x-3 text-xs">
                                <div className="w-3 h-3 rounded-full bg-slate-600"></div>
                                <span className="text-slate-300 font-bold">車種差分 (Delta)</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto bg-slate-950 relative">
                        <div className="zoom-controls">
                            <button onClick={() => setZoom(z => Math.min(z + 0.1, 2))} className="zoom-btn"><i className="fas fa-plus"></i></button>
                            <button onClick={() => setZoom(z => Math.max(z - 0.1, 0.2))} className="zoom-btn"><i className="fas fa-minus"></i></button>
                            <div className="text-center text-[10px] font-black text-slate-500 italic mt-2">{Math.round(zoom * 100)}%</div>
                        </div>

                        <div className="tree-container" style={{ transform: `scale(${zoom})` }}>
                            <header className="mb-20 text-center">
                                <h2 className="text-6xl font-black italic tracking-tighter uppercase mb-4">Platform-Based Management</h2>
                                <p className="text-slate-400 text-lg max-w-2xl mx-auto font-medium">
                                    車種ごとの重複タスクを解体し、共通資産を核とした「最小管理」を実現する。
                                </p>
                            </header>
                            <div className="tree">
                                <ul><TreeNode node={STRATEGY_DATA} /></ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
