<!DOCTYPE html>
<html lang="ja">
<head>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .sidebar-item:hover { background: rgba(37, 99, 235, 0.1); color: #2563eb; }
        .active-sidebar { background: rgba(37, 99, 235, 0.1); color: #2563eb; border-right: 4px solid #2563eb; }
        .logic-line { width: 2px; background: #cbd5e1; margin: 0 auto; height: 20px; }
        .tree-node { transition: all 0.2s ease-out; }
        .issue-tag { animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .tree-container { min-width: 4500px; padding-bottom: 100px; padding-top: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

                                        "R-VAL-09: フリート販売比率の最適化によるブランド保護",
                                        "R-VAL-10: 値引き承認フローへの『リセール影響警告』の実装"
                                    ]
                                }
                            ]
                        },
                        {
                            id: "L3-2", title: "数量 (Q) の確保・シェア拡大", level: "Business Pillar",
                            children: [
                                {

                                        "SC-OPT-03: メキシコ工場向け部品輸出のコンテナ充填率向上",
                                        "SC-OPT-04: CX-80部品向けティア2サプライヤーのリスク評価",
                                        "SC-OPT-05: 宇品工場のリアルタイム部品在庫トラッキング実装"
                                    ]
                                }
                            ]
                        }

                },
                {

                    children: [

                            children: [

                                    issues: [
                                        "RD-CH-01: GVC Plusが乗員の車酔いに与える影響シミュレーション",

                                        "RD-CH-04: ステアリングラックのフリクション低減によるフィードバック改善",
                                        "RD-CH-05: タイヤ空気圧警告センサーの通信プロトコル標準化"
                                    ]
                                }
                            ]

                                    ]
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        const TreeNode = ({ node }) => {
            const [isExpanded, setIsExpanded] = useState(node.level === "Purpose" || node.level === "Strategic Engine");
            const hasChildren = node.children && node.children.length > 0;
            const hasIssues = node.issues && node.issues.length > 0;

            return (
                <div className="flex flex-col items-center w-full mt-2">
                    <div className={`tree-node relative group max-w-sm w-full p-4 rounded-2xl shadow-md border-2 transition-all ${
                        node.type === 'purpose' ? 'bg-gray-900 border-gray-900 text-white' : 
                        node.type === 'engine' ? 'bg-white border-blue-600' : 'bg-white border-gray-200 hover:border-blue-400'
                    }`}>
                        <div className="flex justify-between items-start mb-1">
                            <span className={`text-[8px] font-black uppercase tracking-widest ${
                                node.type === 'purpose' ? 'text-blue-400' : 'text-gray-400'
                            }`}>{node.level}</span>
                            {hasChildren && (
                                <button 
                                    onClick={() => setIsExpanded(!isExpanded)}
                                    className="w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center text-gray-900 hover:bg-blue-600 hover:text-white transition-all shadow-sm"
                                >
                                    <i className={`fas ${isExpanded ? 'fa-minus' : 'fa-plus'} text-[8px]`}></i>
                                </button>
                            )}
                        </div>
                        <h4 className="text-[11px] font-black leading-tight italic">{node.title}</h4>
                        
                        {isExpanded && hasIssues && (
                            <div className="mt-4 pt-3 border-t border-dashed space-y-2">
                                <p className="text-[8px] font-black text-blue-500 uppercase tracking-widest mb-2">Detailed Tasks ({node.issues.length} Issues)</p>
                                <div className="grid grid-cols-1 gap-1">
                                    {node.issues.map((issue, idx) => (
                                        <div key={idx} className="issue-tag bg-blue-600 text-white text-[9px] p-2 rounded-lg font-bold flex items-start shadow-md border border-blue-400">
                                            <i className="fab fa-github mr-2 mt-0.5"></i>
                                            <span className="leading-tight">{issue}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {isExpanded && hasChildren && (
                        <div className="w-full">
                            <div className="logic-line"></div>
                            <div className="flex justify-center space-x-4">
                                {node.children.map(child => (
                                    <TreeNode key={child.id} node={child} />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );

            const [activeTab, setActiveTab] = useState('strategy');

            return (

                    <div className="w-64 glass border-r flex flex-col z-20 shadow-2xl flex-shrink-0">

                            <p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">Enterprise Organizational OS</p>
                        </div>
                        <nav className="flex-1 mt-4">
                            {[
                                { id: 'strategy', icon: 'fa-bullseye', label: 'Strategy Wall' },
                                { id: 'dashboard', icon: 'fa-chart-line', label: 'Sync Status' },
                                { id: 'repository', icon: 'fa-folder-open', label: 'All Knowledge' },
                            ].map(tab => (
                                <div key={tab.id} onClick={() => setActiveTab(tab.id)} 
                                     className={`sidebar-item px-6 py-4 cursor-pointer flex items-center space-x-3 transition-all ${activeTab === tab.id ? 'active-sidebar font-bold bg-blue-50' : 'text-gray-500'}`}>
                                    <i className={`fas ${tab.icon} w-5`}></i>
                                    <span className="text-sm">{tab.label}</span>
                                </div>
                            ))}
                        </nav>
                        <div className="p-6 border-t bg-gray-50">
                            <p className="text-[9px] text-gray-400 font-bold uppercase mb-2">Logged in as</p>
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center text-white text-[10px] font-black">D</div>
                                <span className="text-xs font-black italic">daiki (Admin)</span>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 overflow-auto bg-gray-50 relative">
                        <div className="p-8">
                            {activeTab === 'strategy' && (
                                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">

                                    </header>

                                    <i className="fas fa-satellite-dish text-8xl text-blue-100 mb-8 animate-pulse"></i>

                                    <p className="text-gray-400 text-sm max-w-sm mx-auto leading-relaxed">

                                    </p>
                                </div>
                            )}

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
