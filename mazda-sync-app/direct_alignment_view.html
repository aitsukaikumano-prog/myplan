<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MAZDA Sync | Direct Alignment View</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .direct-path { stroke: #3b82f6; stroke-width: 4px; stroke-dasharray: 10, 5; animation: dash 30s linear infinite; }
        @keyframes dash { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
        .bypass-node { opacity: 0.4; transition: opacity 0.3s; }
        .bypass-node:hover { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 p-10">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div class="max-w-5xl mx-auto space-y-12">
                    <header class="flex justify-between items-end border-b-2 border-slate-200 pb-6">
                        <div>
                            <h1 class="text-4xl font-black italic tracking-tighter">DIRECT <span class="text-blue-600">ALIGNMENT</span></h1>
                            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-1">「部の壁」を越え、直接「マツダの未来」へ繋がる</p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-black bg-blue-600 text-white px-3 py-1 rounded-full uppercase">Enterprise Mode</span>
                        </div>
                    </header>

                    {/* Level 1: 全社戦略 */}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-slate-900 text-white p-8 rounded-3xl shadow-2xl relative overflow-hidden group">
                            <div class="absolute top-0 right-0 p-8 opacity-10 text-7xl"><i class="fas fa-rocket"></i></div>
                            <p class="text-blue-400 text-[10px] font-black uppercase tracking-widest mb-2">Corporate Strategy A</p>
                            <h2 class="text-2xl font-black italic">固定費の構造的削減 (-1,000億円)</h2>
                            <div class="mt-6 flex items-center space-x-2">
                                <div class="flex -space-x-2">
                                    {[1,2,3,4,5].map(i => (
                                        <div key={i} class="w-6 h-6 rounded-full border-2 border-slate-900 bg-slate-700 flex items-center justify-center text-[8px] font-bold">U{i}</div>
                                    ))}
                                </div>
                                <span class="text-[10px] font-bold text-slate-400">他部署の仲間 124名がこの目標に直結</span>
                            </div>
                        </div>

                        <div class="bg-slate-900 text-white p-8 rounded-3xl shadow-2xl relative overflow-hidden opacity-40 grayscale">
                            <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-2">Corporate Strategy B</p>
                            <h2 class="text-2xl font-black italic">限界利益の最大化 (+500億円)</h2>
                        </div>
                    </div>

                    {/* Bypass Section (The Middle Layers) */}
                    <div class="flex justify-around items-center py-4 relative">
                        <div class="bypass-node bg-white border border-slate-200 px-6 py-2 rounded-full text-[10px] font-bold text-slate-400 shadow-sm">R&D本部</div>
                        <div class="bypass-node bg-white border border-slate-200 px-6 py-2 rounded-full text-[10px] font-bold text-slate-400 shadow-sm">商品戦略部</div>
                        <div class="bypass-node bg-white border border-slate-200 px-6 py-2 rounded-full text-[10px] font-bold text-slate-400 shadow-sm">第1開発チーム</div>
                        
                        {/* Connecting Line */}
                        <div class="absolute inset-0 flex justify-center -z-10">
                            <div class="w-0.5 bg-blue-200 h-full border-dashed border-l-2"></div>
                        </div>
                    </div>

                    {/* Level 4: Your Action */}
                    <div class="flex justify-center">
                        <div class="w-full max-w-xl bg-white p-10 rounded-3xl shadow-xl border-t-8 border-blue-600 relative">
                            <div class="absolute -top-5 -right-5 w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center text-xs font-black shadow-2xl ring-4 ring-white">YOU</div>
                            <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-2">Your Direct Contribution</p>
                            <h3 class="text-2xl font-black text-slate-800 italic">佐藤工場長への知見ヒアリング</h3>
                            
                            <div class="mt-8 p-6 bg-blue-50 rounded-2xl border border-blue-100 flex items-start space-x-4">
                                <i class="fas fa-link text-blue-600 mt-1"></i>
                                <div>
                                    <p class="text-xs font-black text-blue-900 mb-1">ダイレクト・アライメント報告:</p>
                                    <p class="text-xs text-blue-800 leading-relaxed font-medium">
                                        このタスクは、中間の承認工程をバイパスして、直接全社戦略の<b>「固定費削減 (-1,000億円)」</b>に紐付けられています。あなたの成果は、本部長や部長のメンツのためではなく、マツダの黒字化に直接カウントされます。
                                    </p>
                                </div>
                            </div>

                            <div class="mt-8 flex justify-between items-center border-t pt-6">
                                <button class="text-[10px] font-black text-slate-400 uppercase hover:text-blue-600 transition-colors">
                                    同じ目標に挑む仲間を見る (124名)
                                </button>
                                <button class="bg-gray-900 text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg hover:bg-black transition-all">
                                    進捗をマツダに刻む
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
    </script>
</body>
</html>
